    const texts = {

        headingTempCorrected: "Lämpötilakorjatut arvot",

        headingOxymetry: "Oksimetria-arvot",
        headingElectrolytes: "Elektrolyyttiarvot",
        headingMetabolites: "Metaboliittiarvot",
        footerPrinted: "Tulostettu",

        gluLabel: "Glu",

        metabolicAcidosisHAGMA: "Metabolinen asidoosi (↑ anionivaje)",
        metabolicAlkalosis: "Metabolinen alkaloosi",
        respiratoryAcidosis: "Respiratorinen asidoosi",
        respiratoryAlkalosis: "Respiratorinen alkaloosi",
        mixedMetAcidRespAcid: "Sekahäiriö (m. asid + r. asid)",
        mixedMetAcidRespAlk: "Sekahäiriö (m. asid + r. alk)",
        mixedMetAlkRespAcid: "Sekahäiriö (m. alk + r. asid)",

        partiallyCompensated: "Osittain Kompensoitu",
        nonCompensated: "Kompensoitumaton",

        feedbackCorrect: "Oikein!",
        feedbackIncorrect: "Väärin.",
        feedbackCorrectAnswerIs: "Oikea vastaus:",
        feedbackPrimaryIs: "Ensisijainen häiriö:",
        feedbackCompensationIs: "Kompensaatio:",
        feedbackDiffDiagTitle: "Erotusdiagnostisia huomioita:",
        explanationSeparator: " ",

        treatmentTitle: "Hoito:", // UUSI
        closeButton: "Sulje",
        helpButtonLabel: "Apua",
        showCasesButton: "Näytä tapausten kuvaukset ja valitse potilascase",

        filterAllLabel: "Kaikki", // UUSI

        filterMetAlkLabel: "Met. Alk.", // UUSI
        filterRespAcidLabel: "Resp. Asid.", // UUSI
        filterRespAlkLabel: "Resp. Alk.", // UUSI
        filterMixedLabel: "Sekahäiriöt",
        filterSpecialtyLabel: "Erikoisala:",
        caseCountLabel: "tapausta",
        helpTitleGeneral: "Astrupin systemaattinen tulkinta",
        helpTitlePH: "pH – veren happamuus",
        helpTitlePCO2: "pCO2 – hengityksen komponentti",
        helpTitleHCO3: "HCO3- – metabolinen komponentti",
        helpTitlePaO2: "pO2 – happeutuminen",
        helpTitleBE: "BE – emäsylimäärä",
        helpTitleAG: "Anionivaje (AG)",
        helpTitleLac: "Laktaatti",
        helpTitleK: "Kalium (K+)",
        helpTitleCl: "Kloridi (Cl-)",
        helpTitleMetHb: "Methemoglobiini (MetHb)",
        helpTitleCOHb: "Häkähemoglobiini (COHb)",

        helpContentGeneral: (
            <Fragment>
                <p className="help-lead">Viisi kysymystä aina samassa järjestyksessä. Käy ne läpi ennen kuin katsot tapauskertomusta – niin opit lukemaan arvoja etkä arvaamaan diagnoosia.</p>

                <h4>1. Onko pH poikkeava?</h4>
                <p>Alle 7.35 on asidemia, yli 7.45 alkalemia. Normaali pH ei sulje pois häiriötä: se voi olla täysin kompensoitu, tai kaksi vastakkaista häiriötä voi kumota toisensa.</p>

                <h4>2. Kumpi selittää pH:n, pCO2 vai HCO3-?</h4>
                <p>Ensisijainen häiriö on se arvo, joka on muuttunut <em>samaan suuntaan</em> kuin pH-poikkeama.</p>
                <table className="help-table">
                    <thead><tr><th>Löydös</th><th>Ensisijainen häiriö</th></tr></thead>
                    <tbody>
                        <tr><td>pH matala + pCO2 korkea</td><td>Respiratorinen asidoosi</td></tr>
                        <tr><td>pH matala + HCO3- matala</td><td>Metabolinen asidoosi</td></tr>
                        <tr><td>pH korkea + pCO2 matala</td><td>Respiratorinen alkaloosi</td></tr>
                        <tr><td>pH korkea + HCO3- korkea</td><td>Metabolinen alkaloosi</td></tr>
                    </tbody>
                </table>

                <h4>3. Yrittääkö toinen arvo korjata tilannetta?</h4>
                <p>Katso nyt sitä arvoa, joka <em>ei</em> ole ensisijainen häiriö. Kompensaation aste luetaan suoraan arvoista – laskukaavoja ei tarvita.</p>
                <table className="help-table">
                    <thead><tr><th>pH</th><th>Kompensoiva arvo</th><th>Vastaus</th></tr></thead>
                    <tbody>
                        <tr><td>Poikkeava</td><td>Viitealueella</td><td>Kompensoitumaton</td></tr>
                        <tr><td>Poikkeava</td><td>Muuttunut auttavaan suuntaan</td><td>Osittain kompensoitu</td></tr>
                        <tr><td>Viitealueella</td><td>Molemmat poikkeavia</td><td>Kompensoitu</td></tr>
                    </tbody>
                </table>
                <div className="help-tip">
                    <strong>Keuhkot reagoivat minuuteissa, munuaiset vuorokausissa.</strong> Siksi kompensaation aste kertoo myös siitä, kuinka kauan tilanne on kestänyt: kompensoitumaton tarkoittaa tuoretta ja kompensoitu pitkään jatkunutta häiriötä. Elimistö ei myöskään ylikompensoi eikä kompensaatio käännä pH:ta toiselle puolelle. Jos siltä näyttää, kyseessä on kaksi häiriötä.
                </div>

                <h4>4. Jos kyseessä on metabolinen asidoosi: katso anionivaje</h4>
                <p>Analysaattori laskee anionivajeen valmiiksi (viitearvo n. 8–12). Kysymys on aina sama: onko vereen kertynyt happoa (anionivaje koholla) vai onko emästä menetetty (anionivaje normaali)? Nämä ovat kaksi täysin eri tautiryhmää.</p>

                <h4>5. Arvioi happeutuminen erikseen ja sovita kliiniseen kuvaan</h4>
                <p>Happo-emästila ja happeutuminen ovat eri asioita. Vertaa pO2:ta ikätaulukkoon ja muista happilisä: lisähapella pO2:n kuuluu olla selvästi viitearvoja korkeampi, joten ”normaali” lukema happilisällä voi kätkeä vakavan ongelman. Kysy lopuksi, sopiiko tulkinta potilaaseen – sama lukusarja sopii moneen tautiin, ja COPD-potilaan korkea HCO3- tarkoittaa eri asiaa kuin oksentelevan potilaan. Jos luvut ja tarina ovat ristiriidassa, epäile sekahäiriötä tai näytevirhettä.</p>

                <div className="help-tip">
                    <strong>Erikoistapaus: pH on viitealueella, mutta sekä pCO2 että HCO3- ovat poikkeavia.</strong> Vertaa pH:ta lukuun 7.40. Sen alle jäävä pH kertoo, että taustalla on asidoosi, ja yli menevä alkaloosi. Katso sitten, kumpi arvo sen selittää.
                </div>
            </Fragment>
        ),

        helpContentPH: (
            <Fragment>
                <p className="help-lead">Viitearvo 7.35–7.45. Kertoo lopputuloksen, ei syytä.</p>
                <ul>
                    <li><strong>Asidemia ja alkalemia</strong> kuvaavat veren pH:ta. <strong>Asidoosi ja alkaloosi</strong> kuvaavat prosessia, joka pH:ta muuttaa. Potilaalla voi olla yhtä aikaa asidoosi ja alkaloosi mutta normaali pH – siksi pelkkä pH ei riitä diagnoosiin.</li>
                    <li>Muutokset ovat suurempia kuin miltä näyttävät: pH 7.10 tarkoittaa noin kaksinkertaista happamuutta pH 7.40:een verrattuna. Pienet luvut ovat siis isoja asioita.</li>
                    <li>Alle 7.20 sydämen pumppausvoima heikkenee, rytmihäiriöalttius kasvaa ja verenpainelääkkeiden teho huononee. Alle 7.0 ja yli 7.6 ovat välittömästi hengenvaarallisia.</li>
                    <li>Alkaloosi laskee ionisoitua kalsiumia (pistely sormissa ja suun ympärillä) ja kaliumia, ja hemoglobiini luovuttaa happea kudoksiin huonommin.</li>
                </ul>
                <div className="help-tip">
                    Hoida syy, älä lukua. Bikarbonaatin antaminen korjaa numeron mutta ei kudosten hapensaantia, ja hyöty siitä on harvinaista.
                </div>
            </Fragment>
        ),

        helpContentPCO2: (unit) => (
            <Fragment>
                <p className="help-lead">
                    Viitearvo {unit === "mmHg" ? "34–45 mmHg" : "4.5–6.0 kPa"}. Mittaa sitä, kuinka hyvin potilas ventiloi – ei mitään muuta.
                </p>
                <ul>
                    <li><strong>Korkea pCO2</strong> tarkoittaa, että potilas hengittää liian vähän. Syitä: hengityskeskuksen lama (opioidit, rauhoittavat lääkkeet, päihteet), hengityslihasten heikkous tai väsyminen, ahtauttava keuhkosairaus, kipu ja väärin säädetty hengityskone.</li>
                    <li><strong>Matala pCO2</strong> tarkoittaa, että potilas hengittää tavallista enemmän. Syitä: kipu, jännitys, kuume, infektio, keuhkoembolia, astma, raskaus – tai metabolisen asidoosin kompensaatio.</li>
                    <li>Nukutetulla ja hengityskoneessa olevalla potilaalla pCO2 on käytännössä se, minkä kone määrää.</li>
                </ul>
                <div className="help-tip">
                    <strong>Vaarallisin löydös on normaali pCO2 väsyvällä, tiheään hengittävällä potilaalla.</strong> Astmakohtauksessa tai vaikeassa metabolisessa asidoosissa pCO2:n kuuluisi olla matala. Nousu viitealueelle kertoo, etteivät hengityslihakset enää jaksa, ja ennakoi hengityksen pysähtymistä.
                </div>
                <p className="help-note">
                    Uloshengityksen hiilidioksidi (EtCO2) on leikkaussalissa jatkuva mittari, mutta se on normaalistikin hieman pienempi kuin valtimoveren pCO2.
                    {unit === "kPa" ? " Muunnos: 1 kPa = 7.5 mmHg." : " Muunnos: 1 mmHg = 0.133 kPa."}
                </p>
            </Fragment>
        ),

        helpContentHCO3: (
            <Fragment>
                <p className="help-lead">Viitearvo 22–27 mmol/l. Aineenvaihdunnan puoli, jota munuaiset säätelevät.</p>
                <ul>
                    <li>Analysaattori ei mittaa bikarbonaattia suoraan vaan laskee sen mitatusta pH:sta ja pCO2:sta. Siksi nämä kolme arvoa eivät voi olla keskenään ristiriidassa – jos siltä näyttää, näytteessä tai lukemassa on virhe.</li>
                    <li><strong>Matala HCO3-:</strong> metabolinen asidoosi (emästä on menetetty tai happoa kertynyt) TAI pitkään jatkuneen respiratorisen alkaloosin kompensaatio.</li>
                    <li><strong>Korkea HCO3-:</strong> metabolinen alkaloosi TAI pitkään jatkuneen respiratorisen asidoosin kompensaatio.</li>
                    <li>Kumpi näistä on kyseessä, ratkeaa pH:sta ja potilaan taustasta. Munuaisten kompensaatiotoimenpiteiden täysi vaste vie 2–5 vuorokautta, joten muutoksen suuruus kertoo myös häiriön kestosta.</li>
                </ul>
                <p className="help-note">Laskimoverestä mitattu &quot;CO2-total&quot; on eri suure, mutta käytännössä lähellä tätä (n. 1–2 mmol/l korkeampi).</p>
            </Fragment>
        ),

        helpContentPaO2: (unit) => (
            <Fragment>
                <p className="help-lead">Kertoo vereen liuenneen hapen osapaineen. Tulkitse aina yhdessä iän ja happilisän kanssa.</p>

                <h4>Ikäsidonnaiset viitearvot (huoneilma)</h4>
                <table className="help-table">
                    <tbody>
                        <tr><td>alle 18 v</td><td>12.0–14.0 kPa</td></tr>
                        <tr><td>18–30 v</td><td>11.0–14.0 kPa</td></tr>
                        <tr><td>31–50 v</td><td>10.3–13.0 kPa</td></tr>
                        <tr><td>51–60 v</td><td>9.7–12.7 kPa</td></tr>
                        <tr><td>61–70 v</td><td>9.3–12.3 kPa</td></tr>
                        <tr><td>71–80 v</td><td>8.8–11.9 kPa</td></tr>
                        <tr><td>yli 80 v</td><td>8.3–11.4 kPa</td></tr>
                    </tbody>
                </table>

                <h4>Kysy kolme asiaa</h4>
                <ul>
                    <li><strong>Paljonko happea potilas saa?</strong> pO2 11 kPa on hyvä huoneilmalla mutta huolestuttava, jos potilaalla on 15 litraa happea maskilla. Kirjaa happilisä aina näytteen yhteyteen – ilman sitä lukua ei voi tulkita.</li>
                    <li><strong>Onko pCO2 samaan aikaan korkea?</strong> Jos on, matala happiarvo voi selittyä pelkästään liian vähäisellä hengityksellä (esim. opioidi). Keuhkot ovat silloin terveet ja tilanne korjaantuu, kun ventilaatio korjaantuu.</li>
                    <li><strong>Onko happiarvo matala, vaikka potilas hengittää tiheästi?</strong> Silloin vika on keuhkoissa: ilma ja verenkierto eivät kohtaa. Näin käy keuhkokuumeessa, keuhkoemboliassa, keuhkopöhössä ja kasaan painuneessa keuhkossa. Jos happilisä ei auta lainkaan, veri ohittaa keuhkorakkulat kokonaan.</li>
                </ul>

                <div className="help-tip">
                    SpO2 ei ole sama asia kuin pO2. Saturaatio 90 % vastaa suunnilleen pO2:ta 8 kPa, ja sen alapuolella pieni saturaation lasku tarkoittaa suurta osapaineen laskua. Saturaatio ei myöskään kerro mitään ventilaatiosta: happilisällä lukema voi näyttää hyvältä, vaikka pCO2 olisi 9 kPa ja potilas nukahtamassa.
                </div>
                <p className="help-note">{unit === "kPa" ? "Muunnos: 1 kPa = 7.5 mmHg." : "Muunnos: 1 mmHg = 0.133 kPa."}</p>
            </Fragment>
        ),

        helpContentBE: (
            <Fragment>
                <p className="help-lead">Viitearvo −3…+3 mmol/l. Selkein yksittäinen mittari aineenvaihdunnan osalta.</p>
                <ul>
                    <li>BE kertoo, kuinka paljon happoa tai emästä tarvittaisiin palauttamaan pH normaaliksi. Hengityksen osuus on vakioitu pois, ja juuri se tekee BE:stä käyttökelpoisen.</li>
                    <li>Negatiivinen BE tarkoittaa metabolista asidoosia, positiivinen metabolista alkaloosia. Luvun suuruus kertoo vaikeusasteen.</li>
                    <li><strong>BE ei juuri muutu tuoreessa respiratorisessa häiriössä.</strong> Jos pCO2 on korkea mutta BE normaali, tilanne on akuutti. Jos BE on selvästi positiivinen, munuaiset ovat kompensoineet päiväkausia. Tämä on nopein tapa erottaa akuutti ja krooninen hiilidioksidin kertyminen.</li>
                    <li>Vammapotilaalla selvästi negatiivinen BE kertoo vuodon määrästä ja huonosta kudosverenkierrosta.</li>
                    <li>BE ei kerro syytä. Erottelu tehdään anionivajeen, laktaatin ja kliinisen kuvan avulla.</li>
                </ul>
            </Fragment>
        ),

        helpContentAG: (
            <Fragment>
                <p className="help-lead">Viitearvo n. 8–12 mmol/l. Analysaattori laskee anionivajeen valmiiksi natriumista, kloridista ja bikarbonaatista – sinun tehtäväsi on tulkita se.</p>
                <p>Anionivaje kuvaa niitä anioneja, joita ei rutiinisti mitata. Metabolisessa asidoosissa kysymys on aina sama: <strong>onko vereen kertynyt jotain tuntematonta anionia/happoa vai onko emästä menetetty?</strong></p>

                <h4>Anionivaje koholla – happoa on kertynyt</h4>
                <ul>
                    <li><strong>Laktaatti:</strong> sokki, verenvuoto, sepsis, suolen tai raajan verenkiertohäiriö, kouristuskohtaus, kova rasitus</li>
                    <li><strong>Ketoaineet:</strong> diabeettinen ketoasidoosi, alkoholi ja nälkiintyminen</li>
                    <li><strong>Munuaisten vajaatoiminta:</strong> happamat kuona-aineet jäävät elimistöön</li>
                    <li><strong>Myrkytykset:</strong> metanoli, etyleeniglykoli, salisylaatti</li>
                </ul>

                <h4>Anionivaje normaali – emästä on menetetty</h4>
                <p>Bikarbonaattia menetetään ja kloridi jää sen tilalle, joten kloridi on tyypillisesti koholla. Tavallisimmat syyt ovat ripuli, runsaseritteinen avanne ja suuret määrät 0.9 % keittosuolaliuosta. Harvinaisempana munuaistubulusten toimintahäiriö.</p>

                <div className="help-tip">
                    Muista, että anionivaje kannattaa katsoa myös silloin, kun pH on normaali. Kohonnut anionivaje kertoo happokuormasta, vaikka jokin toinen häiriö peittäisi sen vaikutuksen pH:hon.
                </div>
            </Fragment>
        ),

        helpContentLac: (
            <Fragment>
                <p className="help-lead">Viitearvo alle 2.0 mmol/l. Kertoo kudosten hapensaannista ja hoidon tehosta.</p>
                <ul>
                    <li><strong>Tavallisin syy on hapenpuute:</strong> kaikki sokin muodot, verenvuoto, sydänpysähdys, suolen tai raajan verenkiertohäiriö sekä vaikea hapetushäiriö.</li>
                    <li><strong>Laktaatti voi nousta myös ilman hapenpuutetta:</strong> kouristuskohtaus, kova lihastyö, salbutamoli ja adrenaliini, metformiini, maksan vajaatoiminta ja tiamiinin puute. Siksi korkea laktaatti ei yksin tarkoita sepsistä.</li>
                    <li>Yli 4 mmol/l on selvä hälytysraja. Yli 2 mmol/l verenpainelääkitystä tarvitsevalla potilaalla täyttää septisen sokin kriteerin.</li>
                    <li><strong>Suunta ratkaisee, ei yksittäinen luku.</strong> Laskeva laktaatti kertoo verenkierron korjaantumisesta, paikallaan pysyvä siitä, ettei hoito ole riittänyt.</li>
                    <li>Virhelähteitä: pitkään kiristetty staassi ja viivästynyt näytteen analysointi.</li>
                </ul>
            </Fragment>
        ),

        helpContentK: (
            <Fragment>
                <p className="help-lead">Viitearvo 3.3–4.8 mmol/l. Verikaasuanalyysin kiireellisin yksittäinen luku, koska suuri poikkeama voi tappaa potilaan tunneissa.</p>

                <h4>Yhteys happo-emästasapainoon</h4>
                <ul>
                    <li>Asidoosissa kalium siirtyy soluista vereen korvatakseen menetettyjä sähköisiä varauksia, joten plasman kalium nousee. Alkaloosissa käy päinvastoin.</li>
                    <li>Plasman kalium ei kerro elimistön kokonaiskaliumia. Ketoasidoosipotilaalla arvo on usein korkea, vaikka varastot ovat tyhjentyneet – ja insuliinihoito romahduttaa arvon nopeasti.</li>
                </ul>

                <div className="help-tip">
                    Ketoasidoosissa: jos kalium on alle matala (noin 3.3), se korvataan ennen insuliinin aloitusta.
                </div>

                <h4>Korkea kalium</h4>
                <p>Munuaisten vajaatoiminta, osa verenpainelääkkeistä, kudostuho (lihasvammat esim murskavammoissa, palovamma, laaja iskemia) ja asidoosi. EKG:ssä korkeat teräväkärkiset (hyperakuutit)T-aallot ja levenevä QRS. Hoito: kalsiumglukonaatti i.v. suojaamaan sydäntä, insuliini-glukoosi ja salbutamoli-inhalaatio siirtämään kaliumia soluihin, tarvittaessa dialyysi.</p>

                <h4>Matala kalium</h4>
                <p>Diureetit, oksentelu ja nenämahaletkun imu, ripuli, alkaloosi, insuliini ja salbutamoli. Aiheuttaa lihasheikkoutta ja rytmihäiriöitä sekä ylläpitää metabolista alkaloosia.</p>

                <p className="help-note">Hemolysoitunut tai pitkään seissyt näyte voi antaa valheellisen korkean kaliumin. Jos arvo ei sovi kliiniseen kuvaan, ota uusi näyte.</p>
            </Fragment>
        ),

        helpContentCl: (
            <Fragment>
                <p className="help-lead">Viitearvo 96–111 mmol/l. Kloridi on usein se luku, joka paljastaa syyn.</p>
                <ul>
                    <li><strong>Korkea kloridi metabolisessa asidoosissa</strong> tarkoittaa lähes aina normaalin anionivajeen asidoosia: bikarbonaattia on menetetty ja kloridi on jäänyt sen tilalle. Syitä ovat ripuli, runsaseritteinen avanne ja suuret määrät 0.9 % keittosuolaliuosta, jossa on kloridia 154 mmol/l eli selvästi enemmän kuin veressä. Balansoidut liuokset kuten Ringer eivät aiheuta samaa.</li>
                    <li><strong>Matala kloridi metabolisessa alkaloosissa</strong> viittaa mahahapon menetykseen (oksentelu, nenämahaletkun imu) tai diureetteihin. Se kertoo samalla, mitä hoidossa pitää korvata: kloridia (keittosuolaliuosta) ja kaliumia.</li>
                    <li>Korkean anionivajeen asidoosissa kloridi on tyypillisesti normaali, koska vajeen aiheuttaa jokin muu happo.</li>
                </ul>
            </Fragment>
        ),

        helpContentMetHb: (
            <Fragment>
                <p className="help-lead">Viitearvo alle 2 %. Epäile, kun potilas on sinertävä mutta happiosapaine on normaali.</p>
                <p>Methemoglobiini on hemoglobiinia, joka ei kykene sitomaan happea, koska se on hapettunut kaksiarvoisesta kolmiarvoiseksi(Fe^3+). Veri näyttää aspiroituna tummanruskealta ja potilas syanoottiselta, vaikka keuhkot toimisivat moitteettomasti.</p>

        { key: "normal", label: texts.filterNormalLabel, test: t => t === texts.normal },
        { key: "metacid", label: texts.filterMetAcidLabel, test: t => METACID_TYPES.includes(t) },

        { key: "mixed", label: texts.filterMixedLabel, test: t => MIXED_TYPES.includes(t) },
    ];
    function categoryKey(primary) {
        const c = CATEGORIES.find(c => c.test(primary));
        return c ? c.key : "other";

    // --- Tallennus selaimen muistiin (epäonnistuu hiljaa esim. privaattitilassa) ---
    function loadStore() {
        try { return JSON.parse(window.localStorage.getItem(STORE_KEY)) || {}; }
        catch (e) { return {}; }
    }
    function saveStore(obj) {
        try { window.localStorage.setItem(STORE_KEY, JSON.stringify(obj)); }
        catch (e) { /* tallennus ei käytettävissä */ }
    }

    // --- Apufunktiot arvojen tulkintaan ---
    function isAbnormal(value, range) {
        if (value === null || value === undefined || isNaN(value) || !range) return false;
        if (range.high !== undefined && range.high !== null && value > range.high) return true;
        if (range.low !== undefined && range.low !== null && value < range.low) return true;
        return false;
    }
    function arrowFor(value, range) {
        if (value === null || value === undefined || isNaN(value) || !range) return "";
        if (range.high !== undefined && range.high !== null && value > range.high) return "\u2191";
        if (range.low !== undefined && range.low !== null && value < range.low) return "\u2193";
        return "";
    }
    function formatRange(range, unit, decimals) {
        if (!range) return "";
        const u = unit ? " " + unit : "";
        const lo = range.low !== undefined && range.low !== null ? range.low.toFixed(decimals) : null;
        const hi = range.high !== undefined && range.high !== null ? range.high.toFixed(decimals) : null;
        if (range === REF_LAC && hi) return "(alle " + hi + u + ")";
        if (lo && hi) return "(" + lo + "\u2013" + hi + u + ")";
        if (hi) return "(alle " + hi + u + ")";
        if (lo) return "(yli " + lo + u + ")";
        return "";
    }
    function anionGapOf(v) {
        if (!v || v.Na === undefined || v.Cl === undefined || v.HCO3 === undefined) return null;
        return v.Na - (v.Cl + v.HCO3);
    }
    function normalizeCase(c) {
        return Object.assign({}, c, {
            type: c.correctPrimary,
            compensated: c.correctCompensation === undefined ? "N/A" : c.correctCompensation
        });
    }
    function newDeck() { return shuffleArray(patientCases.map((_, i) => i)); }

    // --- Vihjeet väärään vastaukseen ---
    function primaryPointer(correctPrimary, v) {
        const pH = v.pH.toFixed(2), pco2 = v.pCO2_kPa.toFixed(1), hco3 = v.HCO3.toFixed(0);
        if (correctPrimary === texts.normal) return "Kaikki arvot ovat viitealueilla (pH " + pH + ", pCO2 " + pco2 + " kPa, HCO3- " + hco3 + ").";
        if (METACID_TYPES.includes(correctPrimary)) return "Matala pH (" + pH + ") yhdessä matalan HCO3-:n (" + hco3 + ") kanssa kertoo metabolisesta asidoosista.";
        if (correctPrimary === texts.metabolicAlkalosis) return "Korkea pH (" + pH + ") yhdessä korkean HCO3-:n (" + hco3 + ") kanssa kertoo metabolisesta alkaloosista.";
        if (correctPrimary === texts.respiratoryAcidosis) return "Matala pH (" + pH + ") yhdessä korkean pCO2:n (" + pco2 + " kPa) kanssa kertoo respiratorisesta asidoosista.";
        if (correctPrimary === texts.respiratoryAlkalosis) return "Korkea pH (" + pH + ") yhdessä matalan pCO2:n (" + pco2 + " kPa) kanssa kertoo respiratorisesta alkaloosista.";
        return "";
    }
    function compensationPointer(scenario) {
        const v = scenario.values;
        const isResp = scenario.correctPrimary === texts.respiratoryAcidosis || scenario.correctPrimary === texts.respiratoryAlkalosis;
        const val = isResp ? v.HCO3 : v.pCO2_kPa;
        const range = isResp ? REF_HCO3 : REF_PCO2_KPA;
        const name = isResp ? "HCO3-" : "pCO2";
        const shown = isResp ? val.toFixed(0) : val.toFixed(1);
        const phNormal = v.pH >= REF_PH.low && v.pH <= REF_PH.high;
        const paramNormal = !isAbnormal(val, range);
        return "pH " + v.pH.toFixed(2) + " on " + (phNormal ? "viitealueella" : "poikkeava") + " ja kompensoiva " +
            name + " " + shown + " on " + (paramNormal ? "viitealueella" : "poikkeava") + ", joten oikea vastaus on: " + scenario.compensated + ".";
    }

    function ReceiptRow({ label, raw, display, unit, range, rangeText, help, onOpenHelp }) {
        const bad = isAbnormal(raw, range);

        return (

                    : <span className="param-name">{label}</span>}
                <span className={"param-value" + (bad ? " abnormal-value" : "")}>{display}</span>
                <span className={"param-arrow" + (bad ? " abnormal-value" : "")}>{dir}</span>
                <span className="param-unit">{unit}</span>
                <span className="param-ref">{rangeText}</span>
            </div>
        );

        const printTime = useMemo(

            return <section className="abg-values error-state"><p>Arvoja ei saatavilla.</p></section>;
        }
        const v = scenario.values;
        const ag = anionGapOf(v);
        const mmHg = pco2Unit === "mmHg";
        const gasUnit = mmHg ? "mmHg" : "kPa";
        const pco2Range = mmHg ? REF_PCO2_MMHG : REF_PCO2_KPA;
        const po2RangeKpa = getPao2RefKpa(v.age);
        const po2Range = mmHg
            ? { low: Math.round(po2RangeKpa.low * KPA_TO_MMHG), high: Math.round(po2RangeKpa.high * KPA_TO_MMHG) }
            : po2RangeKpa;
        const gasDec = mmHg ? 0 : 1;
        const hbRange = getHbRef(v.age);

        return (
            <div className="receipt-scroll-wrapper">
                <section className="abg-values">
                    <div className="receipt-header">
                        <span>{texts.sampleTypeLabel}: {texts.sampleTypeValue}</span>
                        <span className={isAbnormal(v.Temp, REF_TEMP) ? "abnormal-value" : ""}>
                            {arrowFor(v.Temp, REF_TEMP)} {texts.tempLabel}={v.Temp.toFixed(1)}{texts.tempUnit}
                        </span>
                    </div>
                    <hr className="receipt-separator" />

                    <h4 className="receipt-heading">{texts.headingTempCorrected}</h4>

    // --- Avainarvot palautteen yhteydessä ---
    function QuickStrip({ scenario }) {
        const v = scenario.values;
        const ag = anionGapOf(v);
        const items = [
            { k: "pH", val: v.pH.toFixed(2), bad: isAbnormal(v.pH, REF_PH) },
            { k: "pCO2", val: v.pCO2_kPa.toFixed(1), bad: isAbnormal(v.pCO2_kPa, REF_PCO2_KPA) },
            { k: "HCO3-", val: v.HCO3.toFixed(0), bad: isAbnormal(v.HCO3, REF_HCO3) },
            { k: "BE", val: v.BE.toFixed(1), bad: isAbnormal(v.BE, REF_BE) },
            { k: "AG", val: ag !== null ? ag.toFixed(0) : "-", bad: isAbnormal(ag, REF_AG) },
        ];
        return (
            <div className="quick-strip" aria-label={ui.keyValues}>
                {items.map(i => (
                    <span key={i.k} className={"quick-item" + (i.bad ? " quick-bad" : "")}>
                        <span className="quick-key">{i.k}</span> {i.val}
                    </span>
                ))}
            </div>
        );
    }

    function OptionsGrid({ title, options, selectedValue, onSelect, disabled, type, className }) {
        const gridClass = type === "primary" ? "options-grid" : "compensation-grid";
        const buttonClass = type === "primary" ? "option" : "compensation";
        return (
            <div className={(gridClass + " " + (className || "")).trim()}>
                <h2>{title}</h2>
                {options.map(option => (
                    <button key={option} type="button"
                        className={buttonClass + (selectedValue === option ? " selected" : "")}
                        aria-pressed={selectedValue === option}
                        onClick={() => onSelect(option)}
                        disabled={disabled}>
                        {option}
                    </button>
                ))}
            </div>

    }

    // --- Palaute ---
    function FeedbackDisplay({ isCorrect, revealed, scenario, selectedPrimary, selectedCompensation }) {
        const [showTreatment, setShowTreatment] = useState(false);
        if (!scenario || !scenario.values) return null;
        const v = scenario.values;
        const ag = anionGapOf(v);
        const correctPrimary = scenario.correctPrimary;
        const correctComp = scenario.compensated;
        const selMixed = MIXED_TYPES.includes(selectedPrimary);
        const corMixed = MIXED_TYPES.includes(correctPrimary);
        const selMetAcid = METACID_TYPES.includes(selectedPrimary);
        const corMetAcid = METACID_TYPES.includes(correctPrimary);
        const primaryRight = selectedPrimary === correctPrimary;

        const hints = [];
        if (!isCorrect && !revealed) {
            if (selMixed && !corMixed) {
                hints.push("Valitsit sekahäiriön, mutta arvot viittaavat yhteen primäärihäiriöön: " + primaryPointer(correctPrimary, v));
            } else if (!selMixed && corMixed) {
                hints.push("Tässä on kaksi samanaikaista primäärihäiriötä (" + correctPrimary + "). Katso poikkeamat SEKÄ pCO2:ssa ETTÄ HCO3-/BE:ssä ja mieti, kumpi selittää pH:n ja mikä anamneesissa selittää toisen.");
            } else if (selMetAcid && corMetAcid && !primaryRight) {
                hints.push(correctPrimary === texts.metabolicAcidosisHAGMA
                    ? "Tunnistit metabolisen asidoosin, mutta anionivaje (" + (ag !== null ? ag.toFixed(0) : "?") + ") on koholla, eli kyseessä on HAGMA."
                    : "Tunnistit metabolisen asidoosin, mutta anionivaje (" + (ag !== null ? ag.toFixed(0) : "?") + ") on normaali, eli kyseessä on NAGMA.");
            } else if (!primaryRight) {
                hints.push("Valitsit: " + selectedPrimary + ". " + primaryPointer(correctPrimary, v));
            }
            if (primaryRight && correctComp !== "N/A" && selectedCompensation !== correctComp) {
                hints.push("Primäärihäiriö oikein. " + compensationPointer(scenario));
            }
            if (ag !== null && ag > REF_AG.high && !corMetAcid) {
                hints.push("Huomaa myös kohonnut anionivaje (" + ag.toFixed(0) + "): mieti mikä mittaamaton anioni sen selittää.");
            }
            if (v.K < REF_K.low || v.K > REF_K.high) {
                hints.push("Huomaa poikkeava kalium (" + v.K.toFixed(1) + " mmol/L). Muista yhteys happo-emästasapainoon.");
            }
        }

        return (
            <div className={"feedback " + (isCorrect ? "correct" : "incorrect")} aria-live="polite">
                <div className="feedback-summary">
                    <span>{isCorrect ? "\u2705" : "\u274C"}</span>
                    {revealed ? ui.revealedNote : (isCorrect ? texts.feedbackCorrect : texts.feedbackIncorrect)}
                </div>

                <QuickStrip scenario={scenario} />

                {!isCorrect ? (
                    <div className="feedback-correct-answer">
                        <p><strong>{texts.feedbackCorrectAnswerIs}</strong></p>
                        <p><em>{texts.feedbackPrimaryIs}</em> {correctPrimary}</p>
                        {correctComp !== "N/A" ? <p><em>{texts.feedbackCompensationIs}</em> {correctComp}</p> : null}
                        {selectedPrimary && !revealed
                            ? <p className="your-answer"><em>{ui.yourAnswer}:</em> {selectedPrimary}{selectedCompensation ? " + " + selectedCompensation : ""}</p>
                            : null}
                    </div>
                ) : null}

                {hints.length > 0 ? (
                    <div className="feedback-differential">
                        <hr className="feedback-divider" />
                        <p><strong>{texts.feedbackDiffDiagTitle}</strong></p>
                        <ul>{hints.map((h, i) => <li key={i}>{h}</li>)}</ul>
                    </div>
                ) : null}

                <div className="feedback-section">
                    <hr className="feedback-divider" />
                    <h4>{texts.explanationTitle}</h4>
                    <p>{scenario.explanation}</p>
                </div>

                {scenario.treatment ? (
                    <div className="feedback-section feedback-treatment">
                        <button type="button" className="treatment-toggle" aria-expanded={showTreatment}
                            onClick={() => setShowTreatment(!showTreatment)}>
                            {showTreatment ? "\u25BE " : "\u25B8 "}{ui.treatmentToggle}
                        </button>
                        {showTreatment ? <p>{scenario.treatment}</p> : null}
                    </div>
                ) : null}
            </div>
        );
    }

    // --- Modaali (palauttaa fokuksen ja pitää sen sisällään) ---
    function HelpModal({ isOpen, onClose, title, children }) {
        const boxRef = React.useRef(null);
        const openerRef = React.useRef(null);
        useEffect(() => {
            if (!isOpen) return undefined;
            openerRef.current = document.activeElement;
            document.body.classList.add("no-scroll");
            const box = boxRef.current;
            if (box) {
                const first = box.querySelector("button, a, input");
                if (first) first.focus();
            }
            const onKey = e => {
                if (e.key === "Escape") { onClose(); return; }
                if (e.key !== "Tab" || !box) return;
                const items = box.querySelectorAll("button, a[href], input, [tabindex]:not([tabindex='-1'])");
                if (!items.length) return;
                const first = items[0], last = items[items.length - 1];
                if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
                else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
            };
            document.addEventListener("keydown", onKey);
            return () => {
                document.removeEventListener("keydown", onKey);
                document.body.classList.remove("no-scroll");
                if (openerRef.current && openerRef.current.focus) openerRef.current.focus();
            };
        }, [isOpen, onClose]);
        if (!isOpen) return null;
        return createPortal(
            <div className="modal-overlay visible" onClick={onClose}>
                <div className="modal-content" ref={boxRef} role="dialog" aria-modal="true" onClick={e => e.stopPropagation()}>
                    <h2>{title}</h2>
                    <div className="modal-body">{children}</div>
                    <button type="button" className="modal-close-button" onClick={onClose}>{texts.closeButton}</button>
                </div>
            </div>,
            document.getElementById("modal-root")
        );
    }

    // --- Tilastot ---
    function StatsPanel({ stats, onReset }) {
        const rows = CATEGORIES.map(c => {
            const s = stats[c.key] || { n: 0, ok: 0 };
            return { label: c.label, n: s.n, ok: s.ok, pct: s.n ? Math.round(100 * s.ok / s.n) : null };
        });
        const total = rows.reduce((a, r) => ({ n: a.n + r.n, ok: a.ok + r.ok }), { n: 0, ok: 0 });
        if (!total.n) return <p className="stats-empty">{ui.statsEmpty}</p>;
        return (
            <div className="stats-panel">
                {rows.map(r => (
                    <div key={r.label} className="stats-row">
                        <span className="stats-label">{r.label}</span>
                        <span className="stats-bar">
                            <span className="stats-fill" style={{ width: (r.pct === null ? 0 : r.pct) + "%" }}></span>
                        </span>
                        <span className="stats-num">{r.n ? r.ok + "/" + r.n : "\u2013"}</span>
                    </div>
                ))}
                <p className="stats-total">{ui.statsTotal}: {total.ok}/{total.n} ({Math.round(100 * total.ok / total.n)} %)</p>
                <button type="button" className="stats-reset" onClick={onReset}>{ui.statsReset}</button>
            </div>
        );
    }

    // --- Tapauslista sivupaneelissa ---
    function CaseListSidebar({ cases, isOpen, onClose, onSelectCase }) {
        const [filter, setFilter] = useState("All");
        const [spec, setSpec] = useState("All");
        useEffect(() => {
            if (!isOpen) return undefined;
            document.body.classList.add("no-scroll");
            const onKey = e => { if (e.key === "Escape") onClose(); };
            document.addEventListener("keydown", onKey);
            return () => { document.removeEventListener("keydown", onKey); document.body.classList.remove("no-scroll"); };
        }, [isOpen, onClose]);
        const specialties = useMemo(() => {
            const seen = [];
            cases.forEach(c => { if (c.specialty && seen.indexOf(c.specialty) < 0) seen.push(c.specialty); });
            return seen.sort((a, b) => a.localeCompare(b, "fi"));
        }, [cases]);
        const filtered = useMemo(() => {
            const cat = filter === "All" ? null : CATEGORIES.find(c => c.label === filter);
            return cases.filter(c =>
                (!cat || cat.test(c.correctPrimary)) &&
                (spec === "All" || c.specialty === spec));
        }, [cases, filter, spec]);
        if (!isOpen) return null;
        const options = [{ label: texts.filterAllLabel, value: "All" }].concat(CATEGORIES.map(c => ({ label: c.label, value: c.label })));
        return createPortal(
            <Fragment>
                <div className="sidebar-overlay visible" onClick={onClose}></div>
                <div className="sidebar open">
                    <div className="sidebar-header">
                        <h3>{texts.caseListTitle}</h3>
                        <button type="button" onClick={onClose} className="sidebar-close-button" aria-label="Sulje">&times;</button>
                    </div>
                    <div className="sidebar-filter-controls">
                        {options.map(o => (
                            <button key={o.value} type="button"
                                className={"filter-button" + (filter === o.value ? " active" : "")}
                                onClick={() => setFilter(o.value)}>{o.label}</button>
                        ))}
                    </div>
                    <div className="sidebar-select-row">
                        <label htmlFor="specialty-filter">{texts.filterSpecialtyLabel}</label>
                        <select id="specialty-filter" value={spec} onChange={e => setSpec(e.target.value)}>
                            <option value="All">{texts.filterAllLabel}</option>
                            {specialties.map(s => <option key={s} value={s}>{s}</option>)}
                        </select>
                    </div>
                    <div className="sidebar-content">
                        <p className="sidebar-count">{filtered.length} {texts.caseCountLabel}</p>
                        {filtered.length === 0 ? <p className="no-cases-message">Ei tapauksia valitulla suodattimella.</p> : null}
                        <ul>
                            {filtered.map((c, i) => (
                                <li key={c.id || i}>

                                    </button>

    // === PÄÄKOMPONENTTI ===
    function ABGQuiz() {
        const store = useMemo(loadStore, []);
        const [pco2Unit, setPco2Unit] = useState(store.unit === "mmHg" ? "mmHg" : "kPa");
        const [blind, setBlind] = useState(store.blind !== false);
        const [stats, setStats] = useState(store.stats || {});
        const [mode, setMode] = useState("harjoitus");

        const [session, setSession] = useState(() => {
            const d = newDeck();
            return { deck: d, pos: 0, scenario: normalizeCase(patientCases[d[0]]) };
        });
        const [primary, setPrimary] = useState(null);
        const [comp, setComp] = useState(null);
        const [submitted, setSubmitted] = useState(false);
        const [correct, setCorrect] = useState(null);
        const [revealed, setRevealed] = useState(false);
        const [counted, setCounted] = useState(false);
        const [contextShown, setContextShown] = useState(false);

        const [score, setScore] = useState(0);
        const [attempts, setAttempts] = useState(0);
        const [streak, setStreak] = useState(0);
        const [animateScore, setAnimateScore] = useState(false);
        const [examLog, setExamLog] = useState([]);

        const [modal, setModal] = useState(null); // 'help' | 'stats'
        const [modalContent, setModalContent] = useState({ title: "", content: null });
        const [sidebarOpen, setSidebarOpen] = useState(false);

        const scenario = session.scenario;

        useEffect(() => { saveStore({ unit: pco2Unit, blind: blind, stats: stats }); }, [pco2Unit, blind, stats]);
        useEffect(() => {
            if (!animateScore) return undefined;
            const t = setTimeout(() => setAnimateScore(false), 600);
            return () => clearTimeout(t);
        }, [animateScore]);

        const resetAnswer = useCallback(() => {
            setPrimary(null); setComp(null); setSubmitted(false); setCorrect(null);
            setRevealed(false); setCounted(false); setContextShown(false);
        }, []);

        const goTo = useCallback((pos, deckArr) => {
            let d = deckArr || session.deck, p = pos;
            if (p >= d.length) { d = newDeck(); p = 0; }
            setSession({ deck: d, pos: p, scenario: normalizeCase(patientCases[d[p]]) });
            resetAnswer();
            window.scrollTo({ top: 0, behavior: "smooth" });
        }, [session.deck, resetAnswer]);

        const loadSpecificCase = useCallback(id => {
            const idx = patientCases.findIndex(c => c.id === id);
            if (idx < 0) return;
            const pos = session.deck.indexOf(idx);
            setSession({ deck: session.deck, pos: pos >= 0 ? pos : session.pos, scenario: normalizeCase(patientCases[idx]) });
            resetAnswer();
            setSidebarOpen(false);
        }, [session.deck, session.pos, resetAnswer]);

        const needsCompensation = primary !== null && primary !== texts.normal && !MIXED_TYPES.includes(primary);
        const canSubmit = primary !== null && (!needsCompensation || comp !== null);

        const evaluate = () => {
            const corMixed = MIXED_TYPES.includes(scenario.correctPrimary);
            if (scenario.correctPrimary === texts.normal || corMixed) return primary === scenario.correctPrimary;
            if (MIXED_TYPES.includes(primary) || primary === texts.normal) return false;
            return primary === scenario.correctPrimary && comp === scenario.compensated;
        };

        const record = (ok) => {
            setStats(prev => {
                const key = categoryKey(scenario.correctPrimary);
                const cur = prev[key] || { n: 0, ok: 0 };
                return Object.assign({}, prev, { [key]: { n: cur.n + 1, ok: cur.ok + (ok ? 1 : 0) } });
            });
        };

        const celebrate = (newStreak) => {
            if (newStreak < 3) return;
            if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
            if (typeof confetti === "function") confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
        };

        const submit = () => {
            if (submitted || !canSubmit) return;
            const ok = evaluate();
            setCorrect(ok); setSubmitted(true); setContextShown(true);
            if (!counted) {
                setCounted(true);
                setAttempts(a => a + 1);
                record(ok);
                if (ok) { setScore(s => s + 1); setAnimateScore(true); }
                const ns = ok ? streak + 1 : 0;
                setStreak(ns);
                if (ok) celebrate(ns);
            }
            if (mode === "koe") {
                setExamLog(l => l.concat([{
                    context: scenario.context, ok: ok,
                    chosen: primary + (comp ? " + " + comp : ""),
                    right: scenario.correctPrimary + (scenario.compensated !== "N/A" ? " + " + scenario.compensated : "")
                }]));
            }
        };

        const reveal = () => {
            if (submitted) return;
            setRevealed(true); setSubmitted(true); setCorrect(false); setContextShown(true); setStreak(0);
            if (!counted) { setCounted(true); setAttempts(a => a + 1); record(false); }
        };

        const retry = () => { setPrimary(null); setComp(null); setSubmitted(false); setCorrect(null); setRevealed(false); };

        const openHelp = useCallback(topic => {
            const map = {
                pH: [texts.helpTitlePH, texts.helpContentPH],
                pCO2: [texts.helpTitlePCO2, texts.helpContentPCO2(pco2Unit)],
                HCO3: [texts.helpTitleHCO3, texts.helpContentHCO3],
                PaO2: [texts.helpTitlePaO2, texts.helpContentPaO2(pco2Unit)],
                BE: [texts.helpTitleBE, texts.helpContentBE],
                AG: [texts.helpTitleAG, texts.helpContentAG],
                Lac: [texts.helpTitleLac, texts.helpContentLac],
                K: [texts.helpTitleK, texts.helpContentK],
                Cl: [texts.helpTitleCl, texts.helpContentCl],
                MetHb: [texts.helpTitleMetHb, texts.helpContentMetHb],
                COHb: [texts.helpTitleCOHb, texts.helpContentCOHb]
            };
            const found = map[topic] || [texts.helpTitleGeneral, texts.helpContentGeneral];
            setModalContent({ title: found[0], content: found[1] });
            setModal("help");
        }, [pco2Unit]);

        const startExam = () => { setMode("koe"); setExamLog([]); goTo(0, newDeck()); };
        const backToPractice = () => { setMode("harjoitus"); setExamLog([]); goTo(session.pos + 1); };

        const examFinished = mode === "koe" && examLog.length >= EXAM_LENGTH;
        const showCompensationGrid = needsCompensation;
        const showFeedback = submitted && mode !== "koe";

        return (
            <Fragment>
                {createPortal(
                    <Fragment>
                        <ScoreDisplay score={score} attempts={attempts} streak={streak} animate={animateScore}
                            position={session.pos} total={session.deck.length} examCount={examLog.length} mode={mode} />
                        <UnitSelector selectedUnit={pco2Unit} onUnitChange={setPco2Unit} />
                    </Fragment>,
                    document.getElementById("score-root")
                )}

                <div className="container">
                    <h1>{texts.title}</h1>
                    <button type="button" onClick={() => openHelp("general")} className="help-button-general" aria-label="Avaa yleisohje">?</button>

                    <div className="toolbar">
                        <label className="switch">
                            <input type="checkbox" checked={blind} onChange={e => setBlind(e.target.checked)} />
                            <span>{ui.blind}</span>
                        </label>
                        <button type="button" className="toolbar-button" onClick={() => setModal("stats")}>{ui.statsButton}</button>
                        <button type="button" className="toolbar-button" onClick={() => setSidebarOpen(true)}>{texts.showCasesButton}</button>
                        {mode === "harjoitus"
                            ? <button type="button" className="toolbar-button" onClick={startExam}>{ui.examStart}</button>
                            : <button type="button" className="toolbar-button" onClick={() => { setMode("harjoitus"); setExamLog([]); }}>{ui.examBack}</button>}
                    </div>

                    {examFinished ? (
                        <ExamReport log={examLog} onRestart={startExam} onBack={() => { setMode("harjoitus"); setExamLog([]); goTo(session.pos + 1); }} />
                    ) : (
                        <Fragment>
                            {(!blind || contextShown) ? (
                                <div className="case-context">
                                    <p><strong>{texts.caseLabel}</strong> {scenario.context}</p>
                                </div>
                            ) : (
                                <div className="case-context blind-notice">
                                    <p>{ui.blindNotice}</p>
                                    <button type="button" className="secondary-button small" onClick={() => setContextShown(true)}>{ui.showContext}</button>
                                </div>
                            )}

                            <ABGDisplay scenario={scenario} pco2Unit={pco2Unit} onOpenHelp={openHelp} />
                            <p className="help-hint">{ui.helpHint}</p>
                            <hr />

                            <OptionsGrid title={texts.selectPrimary} options={PRIMARY_OPTIONS} selectedValue={primary}
                                onSelect={setPrimary} disabled={submitted} type="primary" />

                            {showCompensationGrid ? (
                                <Fragment>
                                    <hr />
                                    <OptionsGrid className="fade-in-effect" title={texts.selectCompensation}
                                        options={COMPENSATION_OPTIONS} selectedValue={comp} onSelect={setComp}
                                        disabled={submitted} type="compensation" />
                                </Fragment>
                            ) : null}

                            {showFeedback ? (
                                <FeedbackDisplay isCorrect={correct} revealed={revealed} scenario={scenario}
                                    selectedPrimary={primary} selectedCompensation={comp} />
                            ) : null}

                            {submitted && mode === "koe" ? <p className="exam-answered">{ui.examAnswered}</p> : null}

                            <div className="action-bar">
                                {!submitted ? (
                                    <Fragment>
                                        <button type="button" className="new-question" onClick={submit} disabled={!canSubmit}>{ui.answer}</button>
                                        <button type="button" className="secondary-button" onClick={() => goTo(session.pos + 1)}>{ui.skip}</button>
                                        {mode === "harjoitus"
                                            ? <button type="button" className="secondary-button" onClick={reveal}>{ui.reveal}</button>
                                            : null}
                                    </Fragment>
                                ) : (
                                    <Fragment>
                                        <button type="button" className="new-question" onClick={() => goTo(session.pos + 1)}>
                                            {mode === "koe" ? ui.next : texts.newQuestion}
                                        </button>
                                        {mode === "harjoitus" && !correct
                                            ? <button type="button" className="secondary-button" onClick={retry}>{ui.retry}</button>
                                            : null}
                                    </Fragment>
                                )}
                            </div>
                        </Fragment>
                    )}
                </div>

                <HelpModal isOpen={modal === "help"} onClose={() => setModal(null)} title={modalContent.title}>
                    {modalContent.content}
                </HelpModal>
                <HelpModal isOpen={modal === "stats"} onClose={() => setModal(null)} title={ui.statsTitle}>
                    <StatsPanel stats={stats} onReset={() => { if (window.confirm(ui.statsConfirm)) setStats({}); }} />
                    <p className="stats-note">{ui.firstAttemptNote}</p>
                </HelpModal>
                <CaseListSidebar cases={patientCases} isOpen={sidebarOpen}
                    onClose={() => setSidebarOpen(false)} onSelectCase={loadSpecificCase} />
            </Fragment>
        );
    }

    function App() { return <ABGQuiz />; }
    ReactDOM.render(<App />, document.getElementById('root'));

    </script> 
</body>
</html>
