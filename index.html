    // --- Tekstit ja Käännökset (TÄYDELLISET OHJEET) ---
    const texts = {

        footerPrinted: "Tulostettu",

        lacLabel: "Laktaatti",

        normal: "Normaali",
        metabolicAcidosisNAGMA: "Metabolinen asidoosi (Norm. anionivaje)",
        metabolicAcidosisHAGMA: "Metabolinen asidoosi (↑ anionivaje)",
        metabolicAlkalosis: "Metabolinen alkaloosi",
        respiratoryAcidosis: "Respiratorinen asidoosi",
        respiratoryAlkalosis: "Respiratorinen alkaloosi",
        mixedMetAcidRespAcid: "Sekahäiriö (m. asid + r. asid)",
        mixedMetAcidRespAlk: "Sekahäiriö (m. asid + r. alk)",
        mixedMetAlkRespAcid: "Sekahäiriö (m. alk + r. asid)",
        compensated: "Kompensoitu",
        partiallyCompensated: "Osittain Kompensoitu",
        nonCompensated: "Kompensoitumaton",
        newQuestion: "Uusi Tapaus",
        feedbackCorrect: "Oikein!",
        feedbackIncorrect: "Väärin.",
        feedbackCorrectAnswerIs: "Oikea vastaus:",
        feedbackPrimaryIs: "Ensisijainen häiriö:",
        feedbackCompensationIs: "Kompensaatio:",
        feedbackDiffDiagTitle: "Erotusdiagnostisia huomioita:",
        explanationSeparator: " ",
        explanationTitle: "Selitys:", // UUSI
        treatmentTitle: "Hoito:", // UUSI
        closeButton: "Sulje",
        helpButtonLabel: "Apua",
        showCasesButton: "Näytä tapausten kuvaukset ja valitse potilascase",
        caseListTitle: "Potilastapaukset (Valitse case vapaasti)",
        filterAllLabel: "Kaikki", // UUSI
        filterNormalLabel: "Normaali", // UUSI
        filterMetAcidLabel: "Met. Asid.", // UUSI
        filterMetAlkLabel: "Met. Alk.", // UUSI
        filterRespAcidLabel: "Resp. Asid.", // UUSI
        filterRespAlkLabel: "Resp. Alk.", // UUSI
        filterMixedLabel: "Sekahäiriöt", // UUSI
        helpTitleGeneral: "Astrupin systemaattinen tulkinta",
        helpTitlePH: "pH – veren happamuus",
        helpTitlePCO2: "pCO2 – hengityksen komponentti",
        helpTitleHCO3: "HCO3- – metabolinen komponentti",
        helpTitlePaO2: "pO2 – happeutuminen",
        helpTitleBE: "BE – emäsylimäärä",
        helpTitleAG: "Anionivaje (AG)",
        helpTitleLac: "Laktaatti",
        helpTitleK: "Kalium (K+)",
        helpTitleCl: "Kloridi (Cl-)",
        helpTitleMetHb: "Methemoglobiini (MetHb)",

        helpContentGeneral: (
            <Fragment>
                <p className="help-lead">Kuusi kysymystä samassa järjestyksessä joka kerta. Älä katso tapauskertomusta ennen kuin olet käynyt ne läpi.</p>

                <h4>1. Onko pH poikkeava?</h4>
                <p>Asidemia alle 7.35, alkalemia yli 7.45. Normaali pH ei sulje pois häiriötä: se voi olla täysin kompensoitu tai kaksi vastakkaista häiriötä kumoamassa toisiaan.</p>

                <h4>2. Kumpi selittää pH:n, pCO2 vai HCO3-?</h4>
                <p>Se, joka on muuttunut <em>samaan suuntaan</em> kuin pH-poikkeama, on primäärihäiriö.</p>
                <ul>
                    <li>Asidemia + korkea pCO2 &rarr; respiratorinen asidoosi</li>
                    <li>Asidemia + matala HCO3- &rarr; metabolinen asidoosi</li>
                    <li>Alkalemia + matala pCO2 &rarr; respiratorinen alkaloosi</li>
                    <li>Alkalemia + korkea HCO3- &rarr; metabolinen alkaloosi</li>
                </ul>

                <h4>3. Onko kompensaatio odotetun suuruinen?</h4>
                <p>Tämä on kohta, jossa sekahäiriöt paljastuvat. Laske odotettu arvo, älä tyydy siihen että toinen arvo on jotenkin muuttunut.</p>
                <table className="help-table">
                    <thead><tr><th>Primäärihäiriö</th><th>Odotettu kompensaatio</th></tr></thead>
                    <tbody>
                        <tr><td>Metabolinen asidoosi</td><td>pCO2 = 1.5 × HCO3- + 8 mmHg (± 2) <em>(Winter)</em></td></tr>
                        <tr><td>Metabolinen alkaloosi</td><td>pCO2 nousee 0.7 mmHg / HCO3- +1 mmol/l</td></tr>
                        <tr><td>Resp. asidoosi, akuutti</td><td>HCO3- nousee 1 mmol/l / pCO2 +10 mmHg</td></tr>
                        <tr><td>Resp. asidoosi, krooninen</td><td>HCO3- nousee 4 mmol/l / pCO2 +10 mmHg</td></tr>
                        <tr><td>Resp. alkaloosi, akuutti</td><td>HCO3- laskee 2 mmol/l / pCO2 −10 mmHg</td></tr>
                        <tr><td>Resp. alkaloosi, krooninen</td><td>HCO3- laskee 4–5 mmol/l / pCO2 −10 mmHg</td></tr>
                    </tbody>
                </table>
                <p className="help-note">Kaavat ovat mmHg:ssä: 10 mmHg = 1.33 kPa, 1 kPa = 7.5 mmHg.</p>
                <div className="help-tip">
                    <strong>Elimistö ei ylikompensoi.</strong> Jos kompensaatio näyttää ylittävän odotetun, kyseessä ei ole tehokas kompensaatio vaan toinen primäärihäiriö. pH ei myöskään korjaannu kompensaatiolla täysin normaaliksi kuin kroonisissa respiratorisissa häiriöissä.
                </div>

                <h4>4. Jos metabolinen asidoosi: laske anionivaje</h4>
                <p>AG = Na+ − (Cl- + HCO3-). Korkea AG ja normaali AG ovat kaksi täysin eri tautiryhmää. Korkeassa AG:ssä laske vielä delta-suhde (katso AG-ohje) – se paljastaa piilossa olevan toisen metabolisen häiriön.</p>

                <h4>5. Arvioi happeutuminen erikseen</h4>
                <p>Happo-emästila ja happeutuminen ovat eri asioita. Vertaa pO2:ta <em>ikäviitearvoon</em> ja aina happilisään: laske P/F-suhde tai A-a-ero (katso pO2-ohje).</p>

                <h4>6. Sovita kliiniseen kuvaan</h4>
                <p>Sama arvopari sopii moneen tautiin. COPD-potilaan korkea HCO3- tarkoittaa eri asiaa kuin oksentelevan potilaan. Jos luvut ja tarina ovat ristiriidassa, mieti sekahäiriötä.</p>

                <div className="help-tip">
                    <strong>Erikoistapaus: pH normaali, mutta sekä pCO2 että HCO3- poikkeavia.</strong> Kyseessä on joko täysin kompensoitu krooninen häiriö tai sekahäiriö. Vertaa pH:ta arvoon 7.40: alle jäävä pH kertoo taustalla olevasta asidoosista, yli menevä alkaloosista. Katso sitten kumpi arvo selittää sen.
                </div>
            </Fragment>
        ),

        helpContentPH: (
            <Fragment>
                <p className="help-lead">Viitearvo 7.35–7.45. Kertoo lopputuloksen, ei syytä.</p>
                <ul>
                    <li><strong>Asidemia / alkalemia</strong> kuvaavat veren pH:ta. <strong>Asidoosi / alkaloosi</strong> kuvaavat prosessia, joka pH:ta muuttaa. Potilaalla voi olla yhtä aikaa asidoosi ja alkaloosi mutta normaali pH – siksi pelkkä pH ei riitä diagnoosiin.</li>
                    <li>Asteikko on logaritminen: pH 7.10 tarkoittaa noin kaksinkertaista vetyionipitoisuutta pH 7.40:een verrattuna. Pienet luvut ovat siis isoja muutoksia.</li>
                    <li>Alle 7.20: sydämen supistusvoima heikkenee, vaste katekoliamiineille ja vasopressoreille huononee, rytmihäiriöalttius kasvaa. Alle 7.0 ja yli 7.6 ovat välittömästi hengenvaarallisia.</li>
                    <li>Alkaloosi siirtää happidissosiaatiokäyrää vasemmalle (hemoglobiini luovuttaa happea kudoksiin huonommin) ja laskee ionisoitua kalsiumia.</li>
                </ul>
                <div className="help-tip">
                    Hoida syy, älä lukua. Bikarbonaatin antaminen korjaa numeron mutta ei kudosperfuusiota, ja voi pahentaa solunsisäistä asidoosia sekä laskea ionisoitua kalsiumia.
                </div>
            </Fragment>
        ),

        helpContentPCO2: (unit) => (
            <Fragment>
                <p className="help-lead">
                    Viitearvo {unit === "mmHg" ? "34–45 mmHg" : "4.5–6.0 kPa"}. Mittaa alveoliventilaatiota – ei mitään muuta.
                </p>
                <ul>
                    <li>pCO2 määräytyy CO2:n tuotannon ja alveoliventilaation suhteesta. Käytännössä kohonnut pCO2 tarkoittaa aina riittämätöntä ventilaatiota (harvinaisena poikkeuksena massiivinen CO2-tuotanto, esim. maligni hypertermia).</li>
                    <li>Keuhkot reagoivat minuuteissa, munuaiset vuorokausissa. Siksi respiratorinen komponentti muuttuu nopeasti ja metabolinen hitaasti.</li>
                    <li>Kohonnut pCO2 (hyperkapnia) &rarr; respiratorinen asidoosi. Syitä: hengityskeskuksen lama (opioidit, sedatiivit), hengityslihasheikkous, COPD, obstruktio, väärin säädetty hengityskone.</li>
                    <li>Matala pCO2 (hypokapnia) &rarr; respiratorinen alkaloosi. Syitä: kipu, ahdistus, kuume, sepsis, keuhkoembolia, maksan vajaatoiminta, raskaus, salisylaatti, tai metabolisen asidoosin kompensaatio.</li>
                </ul>
                <div className="help-tip">
                    <strong>Vaarallisin löydös on normaali pCO2 väsyvällä, takypnoisella potilaalla.</strong> Astmakohtauksessa tai vaikeassa metabolisessa asidoosissa pCO2:n pitäisi olla matala. Nouseminen viitealueelle kertoo, että hengityslihakset eivät enää jaksa, ja ennakoi hengityksen pysähtymistä.
                </div>
                <p className="help-note">
                    EtCO2 on leikkaussalissa jatkuva mittari, mutta se on normaalistikin n. 0.3–0.7 kPa pienempi kuin PaCO2. Ero suurenee kuolleen tilan kasvaessa (keuhkoembolia, matala minuuttitilavuus).
                    {unit === "kPa" ? " Muunnos: 1 kPa = 7.5 mmHg." : " Muunnos: 1 mmHg = 0.133 kPa."}
                </p>
            </Fragment>
        ),

        helpContentHCO3: (
            <Fragment>
                <p className="help-lead">Viitearvo 22–27 mmol/l. Metabolinen komponentti, munuaisten säätelemä.</p>
                <ul>
                    <li><strong>Analysaattori ei mittaa bikarbonaattia</strong>, vaan laskee sen mitatusta pH:sta ja pCO2:sta Henderson–Hasselbalchin yhtälöllä. Kolme arvoa eivät siksi voi olla keskenään ristiriidassa – jos näyttää siltä, näyte tai lukema on virheellinen.</li>
                    <li>Matala HCO3-: metabolinen asidoosi (emästä menetetty tai happoa kertynyt) TAI kroonisen respiratorisen alkaloosin kompensaatio.</li>
                    <li>Korkea HCO3-: metabolinen alkaloosi TAI kroonisen respiratorisen asidoosin kompensaatio.</li>
                    <li>Kumpi näistä on kyseessä, ratkeaa pH:sta ja kliinisestä kuvasta – tai BE:stä, joka ei muutu akuutissa respiratorisessa häiriössä.</li>
                    <li>Munuaisten täysi kompensaatio vie 2–5 vuorokautta. Sen suuruus paljastaa siis myös häiriön keston.</li>
                </ul>
                <p className="help-note">Laskimoverestä mitattu &quot;CO2-total&quot; on eri suure kuin verikaasujen HCO3-, mutta käytännössä lähellä sitä (n. 1–2 mmol/l korkeampi).</p>
            </Fragment>
        ),

        helpContentPaO2: (unit) => (
            <Fragment>
                <p className="help-lead">Kertoo vereen liuenneen hapen osapaineen. Tulkitse aina yhdessä iän ja happilisän kanssa.</p>

                <h4>Ikäsidonnaiset viitearvot (huoneilma)</h4>
                <table className="help-table">
                    <tbody>
                        <tr><td>alle 18 v</td><td>12.0–14.0 kPa</td></tr>
                        <tr><td>18–30 v</td><td>11.0–14.0 kPa</td></tr>
                        <tr><td>31–50 v</td><td>10.3–13.0 kPa</td></tr>
                        <tr><td>51–60 v</td><td>9.7–12.7 kPa</td></tr>
                        <tr><td>61–70 v</td><td>9.3–12.3 kPa</td></tr>
                        <tr><td>71–80 v</td><td>8.8–11.9 kPa</td></tr>
                        <tr><td>yli 80 v</td><td>8.3–11.4 kPa</td></tr>
                    </tbody>
                </table>

                <h4>Suhteuta happilisään</h4>
                <ul>
                    <li><strong>P/F-suhde</strong> = pO2 / FiO2. Alle 40 kPa (300 mmHg) on poikkeava, alle 26.7 kPa (200 mmHg) keskivaikea ja alle 13.3 kPa (100 mmHg) vaikea ARDS. Ilman FiO2:ta pelkkä pO2 on tulkitsematon.</li>
                    <li><strong>A-a-ero</strong> huoneilmassa: PAO2 ≈ 20 − pCO2 / 0.8 (kPa). Vähennä siitä mitattu pO2. Normaali on alle 2 kPa nuorella ja suurenee iän myötä.</li>
                    <li>Normaali A-a-ero + hypoksemia = hypoventilaatio (esim. opioidit). Suurentunut A-a-ero = keuhkojen ongelma: V/Q-epäsuhta, oikovirtaus, diffuusiohäiriö.</li>
                    <li>Oikovirtaus eli shuntti ei korjaannu happilisällä – jos happi ei auta, epäile shunttia (esim. atelektaasi, keuhkokuume, ARDS).</li>
                </ul>

                <div className="help-tip">
                    SpO2 ei ole sama asia kuin pO2. Dissosiaatiokäyrän mukaan SpO2 90 % vastaa pO2:ta n. 8 kPa (60 mmHg), ja sen alapuolella käyrä putoaa jyrkästi: pieni saturaation lasku tarkoittaa suurta osapaineen laskua. SpO2 ei myöskään kerro mitään ventilaatiosta – happilisällä saturaatio voi näyttää hyvältä vaikka pCO2 olisi 9 kPa.
                </div>
                <p className="help-note">{unit === "kPa" ? "Muunnos: 1 kPa = 7.5 mmHg." : "Muunnos: 1 mmHg = 0.133 kPa."}</p>
            </Fragment>
        ),

        helpContentBE: (
            <Fragment>
                <p className="help-lead">Viitearvo −3…+3 mmol/l. Puhtain metabolisen komponentin mittari.</p>
                <ul>
                    <li>BE kertoo, kuinka paljon happoa tai emästä tarvittaisiin palauttamaan pH arvoon 7.40, kun pCO2 on vakioitu normaaliksi. Juuri tämä vakiointi tekee siitä hengityksestä riippumattoman.</li>
                    <li>Negatiivinen BE (emäsvajaus) = metabolinen asidoosi. Positiivinen BE = metabolinen alkaloosi. Suuruus kertoo vaikeusasteen.</li>
                    <li><strong>BE ei muutu akuutissa respiratorisessa häiriössä.</strong> Jos pCO2 on korkea mutta BE normaali, tilanne on akuutti. Jos BE on selvästi positiivinen, munuaiset ovat kompensoineet päiväkausia eli tila on krooninen. Tämä on nopein tapa erottaa akuutti ja krooninen hyperkapnia.</li>
                    <li>Traumapotilaalla BE on resuskitaation mittari: alle −6 ennustaa merkittävää verenvuotoa ja verensiirron tarvetta, ja korjaantuva BE kertoo perfuusion palautumisesta.</li>
                    <li>BE ei kerro syytä. Negatiivinen BE voi olla laktaattia, ketoaineita tai kloridia – erottelu tehdään anionivajeella.</li>
                </ul>
            </Fragment>
        ),

        helpContentAG: (
            <Fragment>
                <p className="help-lead">AG = Na+ − (Cl- + HCO3-). Viitearvo n. 8–12 mmol/l. Laske aina metabolisessa asidoosissa.</p>
                <p>Anionivaje on mittaamattomien anionien määrä. Kohonnut AG tarkoittaa, että vereen on kertynyt happoa, jota ei rutiinisti mitata.</p>

                <div className="help-tip">
                    <strong>Korjaa albumiinilla.</strong> Albumiini on suurin mittaamaton anioni: lisää AG:hen 2.5 jokaista 10 g/l kohti, jolla albumiini alittaa 40 g/l. Kriittisesti sairaalla hypoalbuminemia voi peittää selvän korkean AG:n asidoosin kokonaan.
                </div>

                <h4>Korkea AG (HAGMA)</h4>
                <ul>
                    <li><strong>Laktaatti:</strong> sokki, iskemia, sepsis, metformiini, maksan vajaatoiminta</li>
                    <li><strong>Ketoaineet:</strong> diabeettinen, alkoholi- tai nälkiintymisketoasidoosi, SGLT2-estäjän euglykeeminen ketoasidoosi</li>
                    <li><strong>Munuaisten vajaatoiminta:</strong> fosfaatti, sulfaatti, orgaaniset hapot</li>
                    <li><strong>Myrkytykset:</strong> metanoli, etyleeniglykoli, salisylaatti, paraseetamoli (pyroglutamiinihappo)</li>
                </ul>
                <p className="help-note">
                    Muistisäännöt <a href="https://en.wikipedia.org/wiki/High_anion_gap_metabolic_acidosis#Mnemonics" target="_blank" rel="noopener noreferrer">GOLD MARK ja MUDPILES</a>. Myrkytysepäilyssä laske myös osmolaalisuusvaje.
                </p>

                <h4>Normaali AG (NAGMA)</h4>
                <p>Bikarbonaattia menetetään ja kloridi korvaa sen, joten asidoosi on hyperkloreeminen: ripuli, ileostomia, renaalinen tubulaarinen asidoosi, asetatsolamidi, runsas 0.9 % NaCl. Virtsan anionivaje erottaa suoliston menetykset (negatiivinen) munuaisperäisistä (positiivinen).</p>

                <h4>Delta-suhde korkeassa AG:ssä</h4>
                <p>Δ AG / Δ HCO3- = (AG − 12) / (24 − HCO3-)</p>
                <ul>
                    <li>alle 1: mukana myös normaalin AG:n asidoosi</li>
                    <li>1–2: puhdas korkean AG:n asidoosi</li>
                    <li>yli 2: mukana myös metabolinen alkaloosi tai krooninen respiratorinen asidoosi</li>
                </ul>
            </Fragment>
        ),

        helpContentLac: (
            <Fragment>
                <p className="help-lead">Viitearvo alle 2.0 mmol/l. Kudosperfuusion ja hoitovasteen mittari.</p>
                <ul>
                    <li><strong>Tyyppi A (kudoshypoksia):</strong> kaikki sokkimuodot, sydänpysähdys, vaikea anemia tai hypoksemia, iskeeminen suoli, häkämyrkytys.</li>
                    <li><strong>Tyyppi B (ei ilmeistä hypoksiaa):</strong> maksan vajaatoiminta (huono puhdistuma), metformiini, adrenaliini ja salbutamoli, kouristus, kova rasitus, tiamiinin puute, maligniteetit, syanidi.</li>
                    <li>Sepsiksessä laktaatti nousee osin adrenergisen, aerobisen glykolyysin kautta – korkea laktaatti ei siis aina tarkoita hapenpuutetta, mutta ennustaa silti huonoa lopputulosta.</li>
                    <li>Yli 2 mmol/l vasopressorihoitoa vaativalla potilaalla täyttää septisen sokin kriteerin. Yli 4 mmol/l on selvä hälytysraja.</li>
                    <li><strong>Trendi ratkaisee</strong>, ei yksittäinen arvo. Laskeva laktaatti kertoo perfuusion korjaantumisesta; jumissa oleva arvo tarkoittaa, ettei hoito ole riittänyt.</li>
                    <li>Virhelähteet: kiristyssiteen pitkä käyttö, viivästynyt analyysi.</li>
                </ul>
            </Fragment>
        ),

        helpContentK: (
            <Fragment>
                <p className="help-lead">Viitearvo 3.3–4.8 mmol/l. Verikaasuanalyysin kiireellisin yksittäinen luku.</p>

                <h4>Yhteys happo-emästasapainoon</h4>
                <ul>
                    <li>Asidoosissa vetyionit siirtyvät soluihin ja kalium ulos &rarr; plasman K+ nousee. Alkaloosissa päinvastoin.</li>
                    <li>Siirtymä on merkittävä <em>epäorgaanisessa</em> asidoosissa (esim. hyperkloreeminen). Laktaatti- ja ketoasidoosissa se on vähäinen: DKA:ssa kaliumin nousu johtuu enemmän insuliinin puutteesta ja hyperosmolaliteetista.</li>
                    <li>Plasman kalium ei kerro kokonaiskaliumia. DKA-potilaalla se on tyypillisesti korkea, vaikka elimistö on menettänyt satoja millimooleja. Insuliinihoito romahduttaa arvon nopeasti.</li>
                </ul>

                <div className="help-tip">
                    DKA:ssa: jos K+ on alle 3.3, korvaa kalium ennen insuliinin aloitusta. Muuten seuraa vaarallinen hypokalemia.
                </div>

                <h4>Hyperkalemia</h4>
                <p>Munuaisten vajaatoiminta, ACE:n estäjät ja spironolaktoni, kudostuho (rabdomyolyysi, palovamma, reperfuusio), varastoveri, asidoosi. EKG: korkeat teräväkärkiset T-aallot, PQ pitenee, QRS levenee, lopulta sinusaalto ja asystole. Hoito: kalsium (kalvon stabilointi), insuliini-glukoosi, salbutamoli, tarvittaessa dialyysi. <strong>Suksinyylikoliini on vasta-aiheinen.</strong></p>

                <h4>Hypokalemia</h4>
                <p>Diureetit, oksentelu ja nenämahaimu, ripuli, hyperaldosteronismi, alkaloosi, insuliini, beeta-agonistit. Aiheuttaa lihasheikkoutta, rytmihäiriöitä ja U-aaltoja. Ylläpitää metabolista alkaloosia. Korjaa samalla magnesium – muuten kalium ei nouse.</p>

                <p className="help-note">Verikaasuanalysaattorin K+ on kokoverestä eikä aina täsmää laboratorion plasma-arvoon. Pseudohyperkalemia: hemolysoitunut näyte, viivästynyt käsittely.</p>
            </Fragment>
        ),

            <Fragment>
                <p className="help-lead">Viitearvo 96–111 mmol/l. Tärkein solunulkoinen anioni ja anionivajeen toinen osatekijä.</p>

                <h4>Metabolisessa asidoosissa</h4>
                <ul>
                    <li>Normaalin anionivajeen asidoosi on lähes aina <strong>hyperkloreeminen</strong>: kun bikarbonaattia menetetään, munuaiset reabsorboivat kloridia sähköisen tasapainon säilyttämiseksi.</li>
                    <li>Syitä: ripuli, ileostomia, renaalinen tubulaarinen asidoosi, asetatsolamidi ja runsas 0.9 % NaCl -infuusio (kloridipitoisuus 154 mmol/l). Balansoidut liuokset kuten Ringer ja Plasmalyte eivät aiheuta samaa.</li>
                    <li>Korkean anionivajeen asidoosissa kloridi on tyypillisesti normaali, koska vajeen aiheuttaa jokin muu anioni.</li>
                </ul>

                <h4>Metabolisessa alkaloosissa</h4>
                <p>Hypokloremia on tavallista (oksentelu, nenämahaimu, diureetit). Kloridi on tässä myös hoidon avain:</p>
                <ul>
                    <li><strong>Kloridiherkkä</strong> alkaloosi (virtsan Cl- alle 20 mmol/l): oksentelu, nenämahaimu, diureettien jälkitila, volyymivaje. Korjaantuu keittosuolalla ja kaliumilla.</li>
                    <li><strong>Kloridiresistentti</strong> alkaloosi (virtsan Cl- yli 20 mmol/l): hyperaldosteronismi, Cushing, vaikea hypokalemia, käytössä oleva diureetti. Keittosuola ei auta, vaan hoidetaan perussyy.</li>
                </ul>
                <p className="help-note">Virtsan kloridi on tässä luotettavampi kuin virtsan natrium, koska diureetti sotkee natriumin erityksen.</p>
            </Fragment>
        ),

        helpContentMetHb: (
            <Fragment>
                <p className="help-lead">Viitearvo alle 2 %. Epäile, kun potilas on syanoottinen mutta pO2 normaali.</p>
                <p>Methemoglobiinissa hemin rauta on hapettunut muotoon Fe3+, joka ei sido happea. Lisäksi jäljelle jäävät normaalit alayksiköt luovuttavat happea kudoksiin huonommin, joten haitta on suurempi kuin pelkkä prosenttiosuus antaisi ymmärtää.</p>

                <h4>Oireet pitoisuuden mukaan</h4>
                <table className="help-table">
                    <tbody>
                        <tr><td>alle 15 %</td><td>usein oireeton</td></tr>
                        <tr><td>15–30 %</td><td>syanoosi, suklaanruskea veri</td></tr>
                        <tr><td>30–50 %</td><td>väsymys, sekavuus, takykardia, hengenahdistus</td></tr>
                        <tr><td>yli 50 %</td><td>rytmihäiriöt, kouristukset, hengenvaara</td></tr>
                    </tbody>
                </table>

                <div className="help-tip">
                    <strong>Saturaatiokuilu.</strong> Tavallinen pulssioksimetri jumittuu noin lukemaan 85 % todellisesta tilanteesta riippumatta, kun taas valtimoverestä laskettu happisaturaatio on korkea ja pO2 normaali. Ero näiden välillä on diagnoosi. Varmistus tehdään co-oksimetrialla, joka on useimmissa verikaasuanalysaattoreissa. Syanoosi ei korjaannu happilisällä.
                </div>

                <h4>Syitä</h4>
                <p>Puudutteet, erityisesti prilokaiini ja bentsokaiini (myös EMLA pienellä lapsella), suuret lidokaiiniannokset. Dapsoni, nitraatit ja nitriitit (myös huumekäytössä), aniliinivärit, nitrobentseeni. Synnynnäiset muodot ovat harvinaisia.</p>

                <h4>Hoito</h4>
                <p>Altisteen lopetus ja happi. Oireiselle tai yli 20–30 %:n pitoisuudessa metyleenisininen 1–2 mg/kg. Huomioi: metyleenisininen ei tehoa G6PD-puutoksessa ja voi aiheuttaa hemolyysin, ja se on serotonergisten lääkkeiden kanssa serotoniinioireyhtymän riski. Vaihtoehtoina askorbiinihappo ja vaikeissa tapauksissa verenvaihto.</p>
            </Fragment>
        ),

    const EXAM_LENGTH = 10;

    const MIXED_TYPES = [texts.mixedMetAcidRespAcid, texts.mixedMetAcidRespAlk, texts.mixedMetAlkRespAcid];
    const METACID_TYPES = [texts.metabolicAcidosisNAGMA, texts.metabolicAcidosisHAGMA];

    // Kiinteä järjestys: opettaa vaihtoehtojen kartan (3 saraketta työpöydällä)
    const PRIMARY_OPTIONS = [
        texts.normal, texts.metabolicAcidosisNAGMA, texts.metabolicAcidosisHAGMA,
        texts.metabolicAlkalosis, texts.respiratoryAcidosis, texts.respiratoryAlkalosis,
        texts.mixedMetAcidRespAcid, texts.mixedMetAcidRespAlk, texts.mixedMetAlkRespAcid
    ];
    const COMPENSATION_OPTIONS = [texts.compensated, texts.partiallyCompensated, texts.nonCompensated];

    const CATEGORIES = [
        { key: "normal", label: texts.filterNormalLabel, test: t => t === texts.normal },
        { key: "metacid", label: texts.filterMetAcidLabel, test: t => METACID_TYPES.includes(t) },
        { key: "metalk", label: texts.filterMetAlkLabel, test: t => t === texts.metabolicAlkalosis },
        { key: "respacid", label: texts.filterRespAcidLabel, test: t => t === texts.respiratoryAcidosis },
        { key: "respalk", label: texts.filterRespAlkLabel, test: t => t === texts.respiratoryAlkalosis },
        { key: "mixed", label: texts.filterMixedLabel, test: t => MIXED_TYPES.includes(t) },
    ];
    function categoryKey(primary) {
        const c = CATEGORIES.find(c => c.test(primary));
        return c ? c.key : "other";
    }

    // --- Tallennus selaimen muistiin (epäonnistuu hiljaa esim. privaattitilassa) ---
    function loadStore() {
        try { return JSON.parse(window.localStorage.getItem(STORE_KEY)) || {}; }
        catch (e) { return {}; }
    }
    function saveStore(obj) {
        try { window.localStorage.setItem(STORE_KEY, JSON.stringify(obj)); }
        catch (e) { /* tallennus ei käytettävissä */ }
    }

    // --- Apufunktiot arvojen tulkintaan ---
    function isAbnormal(value, range) {
        if (value === null || value === undefined || isNaN(value) || !range) return false;
        if (range.high !== undefined && range.high !== null && value > range.high) return true;
        if (range.low !== undefined && range.low !== null && value < range.low) return true;
        return false;
    }
    function arrowFor(value, range) {
        if (value === null || value === undefined || isNaN(value) || !range) return "";
        if (range.high !== undefined && range.high !== null && value > range.high) return "\u2191";
        if (range.low !== undefined && range.low !== null && value < range.low) return "\u2193";
        return "";
    }
    function formatRange(range, unit, decimals) {
        if (!range) return "";
        const u = unit ? " " + unit : "";
        const lo = range.low !== undefined && range.low !== null ? range.low.toFixed(decimals) : null;
        const hi = range.high !== undefined && range.high !== null ? range.high.toFixed(decimals) : null;
        if (range === REF_LAC && hi) return "(alle " + hi + u + ")";
        if (lo && hi) return "(" + lo + "\u2013" + hi + u + ")";
        if (hi) return "(alle " + hi + u + ")";
        if (lo) return "(yli " + lo + u + ")";
        return "";
    }
    function anionGapOf(v) {
        if (!v || v.Na === undefined || v.Cl === undefined || v.HCO3 === undefined) return null;
        return v.Na - (v.Cl + v.HCO3);
    }
    function normalizeCase(c) {
        return Object.assign({}, c, {
            type: c.correctPrimary,
            compensated: c.correctCompensation === undefined ? "N/A" : c.correctCompensation
        });
    }
    function newDeck() { return shuffleArray(patientCases.map((_, i) => i)); }

    // --- Odotettu kompensaatio (Winter ym.) ---
    function expectedCompensation(scenario) {
        if (!scenario || !scenario.values) return null;
        const p = scenario.correctPrimary;
        const HCO3 = scenario.values.HCO3;
        const pco2kPa = scenario.values.pCO2_kPa;
        const pco2mmHg = pco2kPa * KPA_TO_MMHG;
        const asKpa = mmHg => (mmHg * MMHG_TO_KPA).toFixed(1);
        if (METACID_TYPES.includes(p)) {
            const e = 1.5 * HCO3 + 8;
            return "Winterin kaava: odotettu pCO2 = 1.5 x " + HCO3.toFixed(0) + " + 8 = " + e.toFixed(0) +
                " mmHg eli n. " + asKpa(e) + " kPa (vaihtelu +/- 2 mmHg). Mitattu " + pco2kPa.toFixed(1) +
                " kPa. Jos mitattu on selvästi odotettua korkeampi, mukana on myös respiratorinen asidoosi, ja jos matalampi, respiratorinen alkaloosi.";
        }
        if (p === texts.metabolicAlkalosis) {
            const e = 40 + 0.7 * (HCO3 - 24);
            return "pCO2 nousee n. 0.7 mmHg jokaista HCO3-:n mmol/l nousua kohti: odotettu n. " + e.toFixed(0) +
                " mmHg eli " + asKpa(e) + " kPa. Mitattu " + pco2kPa.toFixed(1) + " kPa.";
        }
        if (p === texts.respiratoryAcidosis) {
            const a = 24 + 0.1 * (pco2mmHg - 40), c = 24 + 0.4 * (pco2mmHg - 40);
            return "HCO3- nousee akuutisti n. 1 ja kroonisesti n. 4 mmol/l jokaista 10 mmHg:n pCO2-nousua kohti: akuutissa n. " +
                a.toFixed(0) + ", kroonisessa n. " + c.toFixed(0) + " mmol/l. Mitattu " + HCO3.toFixed(0) +
                " mmol/l, mikä kertoo onko tila akuutti vai krooninen.";
        }
        if (p === texts.respiratoryAlkalosis) {
            const a = 24 - 0.2 * (40 - pco2mmHg), c = 24 - 0.45 * (40 - pco2mmHg);
            return "HCO3- laskee akuutisti n. 2 ja kroonisesti n. 4-5 mmol/l jokaista 10 mmHg:n pCO2-laskua kohti: akuutissa n. " +
                a.toFixed(0) + ", kroonisessa n. " + c.toFixed(0) + " mmol/l. Mitattu " + HCO3.toFixed(0) + " mmol/l.";
        }
        return null;
    }

    // --- Vihjeet väärään vastaukseen ---
    function primaryPointer(correctPrimary, v) {
        const pH = v.pH.toFixed(2), pco2 = v.pCO2_kPa.toFixed(1), hco3 = v.HCO3.toFixed(0);
        if (correctPrimary === texts.normal) return "Kaikki arvot ovat viitealueilla (pH " + pH + ", pCO2 " + pco2 + " kPa, HCO3- " + hco3 + ").";
        if (METACID_TYPES.includes(correctPrimary)) return "Matala pH (" + pH + ") yhdessä matalan HCO3-:n (" + hco3 + ") kanssa kertoo metabolisesta asidoosista.";
        if (correctPrimary === texts.metabolicAlkalosis) return "Korkea pH (" + pH + ") yhdessä korkean HCO3-:n (" + hco3 + ") kanssa kertoo metabolisesta alkaloosista.";
        if (correctPrimary === texts.respiratoryAcidosis) return "Matala pH (" + pH + ") yhdessä korkean pCO2:n (" + pco2 + " kPa) kanssa kertoo respiratorisesta asidoosista.";
        if (correctPrimary === texts.respiratoryAlkalosis) return "Korkea pH (" + pH + ") yhdessä matalan pCO2:n (" + pco2 + " kPa) kanssa kertoo respiratorisesta alkaloosista.";
        return "";
    }
    function compensationPointer(scenario) {
        const v = scenario.values;
        const isResp = scenario.correctPrimary === texts.respiratoryAcidosis || scenario.correctPrimary === texts.respiratoryAlkalosis;
        const val = isResp ? v.HCO3 : v.pCO2_kPa;
        const range = isResp ? REF_HCO3 : REF_PCO2_KPA;
        const name = isResp ? "HCO3-" : "pCO2";
        const shown = isResp ? val.toFixed(0) : val.toFixed(1);
        const phNormal = v.pH >= REF_PH.low && v.pH <= REF_PH.high;
        const paramNormal = !isAbnormal(val, range);
        return "pH " + v.pH.toFixed(2) + " on " + (phNormal ? "viitealueella" : "poikkeava") + " ja kompensoiva " +
            name + " " + shown + " on " + (paramNormal ? "viitealueella" : "poikkeava") + ", joten oikea vastaus on: " + scenario.compensated + ".";
    }

    // --- Pistenäyttö ja asetukset ---
    function ScoreDisplay({ score, attempts, streak, animate, position, total, examCount, mode }) {
        return (
            <div className="score-display">
                <span>{texts.scoreLabel} <span className={"score-number" + (animate ? " score-animated" : "")}>{score}</span></span>
                <span className="score-sep">{texts.attemptsLabel} {attempts}</span>
                {streak >= 2 ? <span className="streak-badge">{ui.streak} {streak}</span> : null}
                <span className="progress-badge">
                    {mode === "koe" ? ui.modeExam + " " + Math.min(examCount + 1, EXAM_LENGTH) + "/" + EXAM_LENGTH
                                    : "Tapaus " + (position + 1) + "/" + total}
                </span>
            </div>
        );
    }

    function UnitSelector({ selectedUnit, onUnitChange }) {
        return (
            <div className="unit-selector">
                <span>{texts.selectUnit}</span>
                <label><input type="radio" name="gasUnit" value="kPa" checked={selectedUnit === "kPa"} onChange={() => onUnitChange("kPa")} /> {texts.kpa}</label>
                <label><input type="radio" name="gasUnit" value="mmHg" checked={selectedUnit === "mmHg"} onChange={() => onUnitChange("mmHg")} /> {texts.mmhg}</label>
            </div>
        );
    }

    // --- Yksi rivi kuitissa ---
    function ReceiptRow({ label, raw, display, unit, range, rangeText, help, onOpenHelp }) {
        const bad = isAbnormal(raw, range);
        const dir = arrowFor(raw, range);
        return (
            <div className="receipt-row">
                {help
                    ? <button type="button" className="param-name has-help" onClick={() => onOpenHelp(help)}>{label}</button>
                    : <span className="param-name">{label}</span>}
                <span className={"param-value" + (bad ? " abnormal-value" : "")}>{display}</span>
                <span className={"param-arrow" + (bad ? " abnormal-value" : "")}>{dir}</span>
                <span className="param-unit">{unit}</span>
                <span className="param-ref">{rangeText}</span>
            </div>
        );
    }

    // --- Kuitti eli verikaasuanalyysin tuloste ---
    function ABGDisplay({ scenario, pco2Unit, onOpenHelp }) {
        const printTime = useMemo(
            () => new Date().toLocaleTimeString("fi-FI", { hour: "2-digit", minute: "2-digit" }),
            [scenario ? scenario.id : null]
        );
        if (!scenario || !scenario.values) {
            return <section className="abg-values error-state"><p>Arvoja ei saatavilla.</p></section>;
        }

        const ag = anionGapOf(v);
        const mmHg = pco2Unit === "mmHg";

        const pco2Range = mmHg ? REF_PCO2_MMHG : REF_PCO2_KPA;
        const po2RangeKpa = getPao2RefKpa(v.age);
        const po2Range = mmHg
            ? { low: Math.round(po2RangeKpa.low * KPA_TO_MMHG), high: Math.round(po2RangeKpa.high * KPA_TO_MMHG) }

        const gasDec = mmHg ? 0 : 1;

        return (

                    <hr className="receipt-separator" />

                    <h4 className="receipt-heading">{texts.headingTempCorrected}</h4>
                    <ReceiptRow label={texts.phLabel} raw={v.pH} display={v.pH.toFixed(3)} unit=""
                        range={REF_PH} rangeText={formatRange(REF_PH, "", 2)} help="pH" onOpenHelp={onOpenHelp} />
                    <ReceiptRow label={<Fragment>pCO<sub>2</sub>(T)</Fragment>} raw={v.pCO2_kPa}
                        display={(mmHg ? v.pCO2_kPa * KPA_TO_MMHG : v.pCO2_kPa).toFixed(gasDec + 1)} unit={gasUnit}
                        range={REF_PCO2_KPA} rangeText={formatRange(pco2Range, gasUnit, gasDec)} help="pCO2" onOpenHelp={onOpenHelp} />
                    <ReceiptRow label={<Fragment>pO<sub>2</sub>(T)</Fragment>} raw={v.PaO2_kPa}
                        display={(mmHg ? v.PaO2_kPa * KPA_TO_MMHG : v.PaO2_kPa).toFixed(gasDec)} unit={gasUnit}
                        range={po2RangeKpa} rangeText={formatRange(po2Range, gasUnit, gasDec)} help="PaO2" onOpenHelp={onOpenHelp} />

                    <h4 className="receipt-heading">{texts.headingAcidBase}</h4>
                    <ReceiptRow label={<Fragment>HCO<sub>3</sub><sup>-</sup></Fragment>} raw={v.HCO3} display={v.HCO3.toFixed(1)}
                        unit="mmol/L" range={REF_HCO3} rangeText={formatRange(REF_HCO3, "mmol/L", 0)} help="HCO3" onOpenHelp={onOpenHelp} />
                    <ReceiptRow label={texts.beLabel} raw={v.BE} display={v.BE.toFixed(1)}
                        unit="mmol/L" range={REF_BE} rangeText={formatRange(REF_BE, "mmol/L", 0)} help="BE" onOpenHelp={onOpenHelp} />
                    {ag !== null
                        ? <ReceiptRow label={texts.agLabel} raw={ag} display={ag.toFixed(0)}
                            unit="mmol/L" range={REF_AG} rangeText={formatRange(REF_AG, "mmol/L", 0)} help="AG" onOpenHelp={onOpenHelp} />
                        : null}

                    <h4 className="receipt-heading">{texts.headingOxymetry}</h4>
                    <ReceiptRow label={texts.hbLabel} raw={v.Hb} display={v.Hb.toFixed(0)}
                        unit="g/L" range={REF_HB} rangeText={formatRange(REF_HB, "g/L", 0)} />
                    <ReceiptRow label={texts.methbLabel} raw={v.MetHb} display={v.MetHb.toFixed(1)}
                        unit="%" range={REF_METHB} rangeText={formatRange(REF_METHB, "%", 1)} help="MetHb" onOpenHelp={onOpenHelp} />

                    <h4 className="receipt-heading">{texts.headingElectrolytes}</h4>
                    <ReceiptRow label={<Fragment>K<sup>+</sup></Fragment>} raw={v.K} display={v.K.toFixed(1)}
                        unit="mmol/L" range={REF_K} rangeText={formatRange(REF_K, "mmol/L", 1)} help="K" onOpenHelp={onOpenHelp} />
                    <ReceiptRow label={<Fragment>Na<sup>+</sup></Fragment>} raw={v.Na} display={v.Na.toFixed(0)}
                        unit="mmol/L" range={REF_NA} rangeText={formatRange(REF_NA, "mmol/L", 0)} />
                    <ReceiptRow label={<Fragment>Ca<sup>2+</sup></Fragment>} raw={v.Ca2} display={v.Ca2.toFixed(2)}
                        unit="mmol/L" range={REF_CA2} rangeText={formatRange(REF_CA2, "mmol/L", 2)} />
                    <ReceiptRow label={<Fragment>Cl<sup>-</sup></Fragment>} raw={v.Cl} display={v.Cl.toFixed(0)}
                        unit="mmol/L" range={REF_CL} rangeText={formatRange(REF_CL, "mmol/L", 0)} help="Cl" onOpenHelp={onOpenHelp} />

                    <h4 className="receipt-heading">{texts.headingMetabolites}</h4>
                    <ReceiptRow label={texts.gluLabel} raw={v.Glu} display={v.Glu.toFixed(1)}
                        unit="mmol/L" range={REF_GLU} rangeText={formatRange(REF_GLU, "mmol/L", 1)} />
                    <ReceiptRow label={texts.lacLabel} raw={v.Lac} display={v.Lac.toFixed(1)}
                        unit="mmol/L" range={REF_LAC} rangeText={formatRange(REF_LAC, "mmol/L", 1)} help="Lac" onOpenHelp={onOpenHelp} />

                    <hr className="receipt-separator" />
                    <div className="receipt-footer">{texts.footerPrinted} {printTime}</div>
                </section>
            </div>
        );
    }

    // --- Avainarvot palautteen yhteydessä ---
    function QuickStrip({ scenario }) {
        const v = scenario.values;
        const ag = anionGapOf(v);
        const items = [
            { k: "pH", val: v.pH.toFixed(2), bad: isAbnormal(v.pH, REF_PH) },
            { k: "pCO2", val: v.pCO2_kPa.toFixed(1), bad: isAbnormal(v.pCO2_kPa, REF_PCO2_KPA) },
            { k: "HCO3-", val: v.HCO3.toFixed(0), bad: isAbnormal(v.HCO3, REF_HCO3) },
            { k: "BE", val: v.BE.toFixed(1), bad: isAbnormal(v.BE, REF_BE) },
            { k: "AG", val: ag !== null ? ag.toFixed(0) : "-", bad: isAbnormal(ag, REF_AG) },
        ];
        return (
            <div className="quick-strip" aria-label={ui.keyValues}>
                {items.map(i => (
                    <span key={i.k} className={"quick-item" + (i.bad ? " quick-bad" : "")}>
                        <span className="quick-key">{i.k}</span> {i.val}
                    </span>
                ))}
            </div>
        );
    }

    function OptionsGrid({ title, options, selectedValue, onSelect, disabled, type, className }) {
        const gridClass = type === "primary" ? "options-grid" : "compensation-grid";
        const buttonClass = type === "primary" ? "option" : "compensation";
        return (
            <div className={(gridClass + " " + (className || "")).trim()}>
                <h2>{title}</h2>
                {options.map(option => (
                    <button key={option} type="button"
                        className={buttonClass + (selectedValue === option ? " selected" : "")}
                        aria-pressed={selectedValue === option}
                        onClick={() => onSelect(option)}
                        disabled={disabled}>
                        {option}
                    </button>
                ))}
            </div>
        );
    }

    // --- Palaute ---
    function FeedbackDisplay({ isCorrect, revealed, scenario, selectedPrimary, selectedCompensation }) {
        const [showTreatment, setShowTreatment] = useState(false);
        if (!scenario || !scenario.values) return null;
        const v = scenario.values;
        const ag = anionGapOf(v);
        const correctPrimary = scenario.correctPrimary;
        const correctComp = scenario.compensated;
        const selMixed = MIXED_TYPES.includes(selectedPrimary);
        const corMixed = MIXED_TYPES.includes(correctPrimary);
        const selMetAcid = METACID_TYPES.includes(selectedPrimary);
        const corMetAcid = METACID_TYPES.includes(correctPrimary);
        const primaryRight = selectedPrimary === correctPrimary;
        const expected = expectedCompensation(scenario);

        const hints = [];
        if (!isCorrect && !revealed) {
            if (selMixed && !corMixed) {
                hints.push("Valitsit sekahäiriön, mutta arvot viittaavat yhteen primäärihäiriöön: " + primaryPointer(correctPrimary, v));
            } else if (!selMixed && corMixed) {
                hints.push("Tässä on kaksi samanaikaista primäärihäiriötä (" + correctPrimary + "). Katso poikkeamat SEKÄ pCO2:ssa ETTÄ HCO3-/BE:ssä ja mieti, kumpi selittää pH:n ja mikä anamneesissa selittää toisen.");
            } else if (selMetAcid && corMetAcid && !primaryRight) {
                hints.push(correctPrimary === texts.metabolicAcidosisHAGMA
                    ? "Tunnistit metabolisen asidoosin, mutta anionivaje (" + (ag !== null ? ag.toFixed(0) : "?") + ") on koholla, eli kyseessä on HAGMA."
                    : "Tunnistit metabolisen asidoosin, mutta anionivaje (" + (ag !== null ? ag.toFixed(0) : "?") + ") on normaali, eli kyseessä on NAGMA.");
            } else if (!primaryRight) {
                hints.push("Valitsit: " + selectedPrimary + ". " + primaryPointer(correctPrimary, v));
            }
            if (primaryRight && correctComp !== "N/A" && selectedCompensation !== correctComp) {
                hints.push("Primäärihäiriö oikein. " + compensationPointer(scenario));
            }
            if (ag !== null && ag > REF_AG.high && !corMetAcid) {
                hints.push("Huomaa myös kohonnut anionivaje (" + ag.toFixed(0) + "): mieti mikä mittaamaton anioni sen selittää.");
            }
            if (v.K < REF_K.low || v.K > REF_K.high) {
                hints.push("Huomaa poikkeava kalium (" + v.K.toFixed(1) + " mmol/L). Muista yhteys happo-emästasapainoon.");
            }
        }

        return (
            <div className={"feedback " + (isCorrect ? "correct" : "incorrect")} aria-live="polite">
                <div className="feedback-summary">
                    <span>{isCorrect ? "\u2705" : "\u274C"}</span>
                    {revealed ? ui.revealedNote : (isCorrect ? texts.feedbackCorrect : texts.feedbackIncorrect)}
                </div>

                <QuickStrip scenario={scenario} />

                {!isCorrect ? (
                    <div className="feedback-correct-answer">
                        <p><strong>{texts.feedbackCorrectAnswerIs}</strong></p>
                        <p><em>{texts.feedbackPrimaryIs}</em> {correctPrimary}</p>
                        {correctComp !== "N/A" ? <p><em>{texts.feedbackCompensationIs}</em> {correctComp}</p> : null}
                        {selectedPrimary && !revealed
                            ? <p className="your-answer"><em>{ui.yourAnswer}:</em> {selectedPrimary}{selectedCompensation ? " + " + selectedCompensation : ""}</p>
                            : null}
                    </div>
                ) : null}

                {hints.length > 0 ? (
                    <div className="feedback-differential">
                        <hr className="feedback-divider" />
                        <p><strong>{texts.feedbackDiffDiagTitle}</strong></p>
                        <ul>{hints.map((h, i) => <li key={i}>{h}</li>)}</ul>
                    </div>
                ) : null}

                <div className="feedback-section">
                    <hr className="feedback-divider" />
                    <h4>{texts.explanationTitle}</h4>
                    <p>{scenario.explanation}</p>
                </div>

                {expected ? (
                    <div className="feedback-section">
                        <h4>{ui.expectedTitle}</h4>
                        <p>{expected}</p>
                    </div>
                ) : null}

                {scenario.treatment ? (
                    <div className="feedback-section feedback-treatment">
                        <button type="button" className="treatment-toggle" aria-expanded={showTreatment}
                            onClick={() => setShowTreatment(!showTreatment)}>
                            {showTreatment ? "\u25BE " : "\u25B8 "}{ui.treatmentToggle}
                        </button>
                        {showTreatment ? <p>{scenario.treatment}</p> : null}
                    </div>
                ) : null}
            </div>
        );
    }

    // --- Modaali (palauttaa fokuksen ja pitää sen sisällään) ---
    function HelpModal({ isOpen, onClose, title, children }) {
        const boxRef = React.useRef(null);
        const openerRef = React.useRef(null);
        useEffect(() => {
            if (!isOpen) return undefined;
            openerRef.current = document.activeElement;
            document.body.classList.add("no-scroll");
            const box = boxRef.current;
            if (box) {
                const first = box.querySelector("button, a, input");
                if (first) first.focus();
            }
            const onKey = e => {
                if (e.key === "Escape") { onClose(); return; }
                if (e.key !== "Tab" || !box) return;
                const items = box.querySelectorAll("button, a[href], input, [tabindex]:not([tabindex='-1'])");
                if (!items.length) return;
                const first = items[0], last = items[items.length - 1];
                if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
                else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
            };
            document.addEventListener("keydown", onKey);
            return () => {
                document.removeEventListener("keydown", onKey);
                document.body.classList.remove("no-scroll");
                if (openerRef.current && openerRef.current.focus) openerRef.current.focus();
            };
        }, [isOpen, onClose]);
        if (!isOpen) return null;
        return createPortal(
            <div className="modal-overlay visible" onClick={onClose}>
                <div className="modal-content" ref={boxRef} role="dialog" aria-modal="true" onClick={e => e.stopPropagation()}>
                    <h2>{title}</h2>
                    <div className="modal-body">{children}</div>
                    <button type="button" className="modal-close-button" onClick={onClose}>{texts.closeButton}</button>
                </div>
            </div>,
            document.getElementById("modal-root")
        );
    }

    // --- Tilastot ---
    function StatsPanel({ stats, onReset }) {
        const rows = CATEGORIES.map(c => {
            const s = stats[c.key] || { n: 0, ok: 0 };
            return { label: c.label, n: s.n, ok: s.ok, pct: s.n ? Math.round(100 * s.ok / s.n) : null };
        });
        const total = rows.reduce((a, r) => ({ n: a.n + r.n, ok: a.ok + r.ok }), { n: 0, ok: 0 });
        if (!total.n) return <p className="stats-empty">{ui.statsEmpty}</p>;
        return (
            <div className="stats-panel">
                {rows.map(r => (
                    <div key={r.label} className="stats-row">
                        <span className="stats-label">{r.label}</span>
                        <span className="stats-bar">
                            <span className="stats-fill" style={{ width: (r.pct === null ? 0 : r.pct) + "%" }}></span>
                        </span>
                        <span className="stats-num">{r.n ? r.ok + "/" + r.n : "\u2013"}</span>
                    </div>
                ))}
                <p className="stats-total">{ui.statsTotal}: {total.ok}/{total.n} ({Math.round(100 * total.ok / total.n)} %)</p>
                <button type="button" className="stats-reset" onClick={onReset}>{ui.statsReset}</button>
            </div>
        );
    }

    // --- Tapauslista sivupaneelissa ---
    function CaseListSidebar({ cases, isOpen, onClose, onSelectCase }) {
        const [filter, setFilter] = useState("All");
        useEffect(() => {
            if (!isOpen) return undefined;
            document.body.classList.add("no-scroll");
            const onKey = e => { if (e.key === "Escape") onClose(); };
            document.addEventListener("keydown", onKey);
            return () => { document.removeEventListener("keydown", onKey); document.body.classList.remove("no-scroll"); };
        }, [isOpen, onClose]);
        const filtered = useMemo(() => {
            if (filter === "All") return cases;
            const cat = CATEGORIES.find(c => c.label === filter);

        }, [cases, filter]);
        if (!isOpen) return null;
        const options = [{ label: texts.filterAllLabel, value: "All" }].concat(CATEGORIES.map(c => ({ label: c.label, value: c.label })));
        return createPortal(
            <Fragment>
                <div className="sidebar-overlay visible" onClick={onClose}></div>
                <div className="sidebar open">
                    <div className="sidebar-header">

                        <button type="button" onClick={onClose} className="sidebar-close-button" aria-label="Sulje">&times;</button>
                    </div>
                    <div className="sidebar-filter-controls">
                        {options.map(o => (
                            <button key={o.value} type="button"
                                className={"filter-button" + (filter === o.value ? " active" : "")}
                                onClick={() => setFilter(o.value)}>{o.label}</button>
                        ))}

                    <div className="sidebar-content">
                        {filtered.length === 0 ? <p className="no-cases-message">Ei tapauksia valitulla suodattimella.</p> : null}

    // === PÄÄKOMPONENTTI ===
    function ABGQuiz() {
        const store = useMemo(loadStore, []);
        const [pco2Unit, setPco2Unit] = useState(store.unit === "mmHg" ? "mmHg" : "kPa");
        const [blind, setBlind] = useState(store.blind !== false);
        const [stats, setStats] = useState(store.stats || {});
        const [mode, setMode] = useState("harjoitus");

        const [session, setSession] = useState(() => {
            const d = newDeck();
            return { deck: d, pos: 0, scenario: normalizeCase(patientCases[d[0]]) };
        });
        const [primary, setPrimary] = useState(null);
        const [comp, setComp] = useState(null);
        const [submitted, setSubmitted] = useState(false);
        const [correct, setCorrect] = useState(null);
        const [revealed, setRevealed] = useState(false);
        const [counted, setCounted] = useState(false);
        const [contextShown, setContextShown] = useState(false);

        const [score, setScore] = useState(0);
        const [attempts, setAttempts] = useState(0);
        const [streak, setStreak] = useState(0);
        const [animateScore, setAnimateScore] = useState(false);
        const [examLog, setExamLog] = useState([]);

        const [modal, setModal] = useState(null); // 'help' | 'stats'
        const [modalContent, setModalContent] = useState({ title: "", content: null });
        const [sidebarOpen, setSidebarOpen] = useState(false);

        const scenario = session.scenario;

        useEffect(() => { saveStore({ unit: pco2Unit, blind: blind, stats: stats }); }, [pco2Unit, blind, stats]);
        useEffect(() => {
            if (!animateScore) return undefined;
            const t = setTimeout(() => setAnimateScore(false), 600);
            return () => clearTimeout(t);
        }, [animateScore]);

        const resetAnswer = useCallback(() => {
            setPrimary(null); setComp(null); setSubmitted(false); setCorrect(null);
            setRevealed(false); setCounted(false); setContextShown(false);
        }, []);

        const goTo = useCallback((pos, deckArr) => {
            let d = deckArr || session.deck, p = pos;
            if (p >= d.length) { d = newDeck(); p = 0; }
            setSession({ deck: d, pos: p, scenario: normalizeCase(patientCases[d[p]]) });
            resetAnswer();
            window.scrollTo({ top: 0, behavior: "smooth" });
        }, [session.deck, resetAnswer]);

        const loadSpecificCase = useCallback(id => {
            const idx = patientCases.findIndex(c => c.id === id);
            if (idx < 0) return;
            const pos = session.deck.indexOf(idx);
            setSession({ deck: session.deck, pos: pos >= 0 ? pos : session.pos, scenario: normalizeCase(patientCases[idx]) });
            resetAnswer();
            setSidebarOpen(false);
        }, [session.deck, session.pos, resetAnswer]);

        const needsCompensation = primary !== null && primary !== texts.normal && !MIXED_TYPES.includes(primary);
        const canSubmit = primary !== null && (!needsCompensation || comp !== null);

        const evaluate = () => {
            const corMixed = MIXED_TYPES.includes(scenario.correctPrimary);
            if (scenario.correctPrimary === texts.normal || corMixed) return primary === scenario.correctPrimary;
            if (MIXED_TYPES.includes(primary) || primary === texts.normal) return false;
            return primary === scenario.correctPrimary && comp === scenario.compensated;
        };

        const record = (ok) => {
            setStats(prev => {
                const key = categoryKey(scenario.correctPrimary);
                const cur = prev[key] || { n: 0, ok: 0 };
                return Object.assign({}, prev, { [key]: { n: cur.n + 1, ok: cur.ok + (ok ? 1 : 0) } });
            });
        };

        const celebrate = (newStreak) => {
            if (newStreak < 3) return;
            if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
            if (typeof confetti === "function") confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
        };

        const submit = () => {
            if (submitted || !canSubmit) return;
            const ok = evaluate();
            setCorrect(ok); setSubmitted(true); setContextShown(true);
            if (!counted) {
                setCounted(true);
                setAttempts(a => a + 1);
                record(ok);
                if (ok) { setScore(s => s + 1); setAnimateScore(true); }
                const ns = ok ? streak + 1 : 0;
                setStreak(ns);
                if (ok) celebrate(ns);
            }
            if (mode === "koe") {
                setExamLog(l => l.concat([{
                    context: scenario.context, ok: ok,
                    chosen: primary + (comp ? " + " + comp : ""),
                    right: scenario.correctPrimary + (scenario.compensated !== "N/A" ? " + " + scenario.compensated : "")
                }]));
            }
        };

        const reveal = () => {
            if (submitted) return;
            setRevealed(true); setSubmitted(true); setCorrect(false); setContextShown(true); setStreak(0);
            if (!counted) { setCounted(true); setAttempts(a => a + 1); record(false); }
        };

        const retry = () => { setPrimary(null); setComp(null); setSubmitted(false); setCorrect(null); setRevealed(false); };

        const openHelp = useCallback(topic => {
            const map = {
                pH: [texts.helpTitlePH, texts.helpContentPH],
                pCO2: [texts.helpTitlePCO2, texts.helpContentPCO2(pco2Unit)],
                HCO3: [texts.helpTitleHCO3, texts.helpContentHCO3],
                PaO2: [texts.helpTitlePaO2, texts.helpContentPaO2(pco2Unit)],
                BE: [texts.helpTitleBE, texts.helpContentBE],
                AG: [texts.helpTitleAG, texts.helpContentAG],
                Lac: [texts.helpTitleLac, texts.helpContentLac],
                K: [texts.helpTitleK, texts.helpContentK],
                Cl: [texts.helpTitleCl, texts.helpContentCl],
                MetHb: [texts.helpTitleMetHb, texts.helpContentMetHb]
            };
            const found = map[topic] || [texts.helpTitleGeneral, texts.helpContentGeneral];
            setModalContent({ title: found[0], content: found[1] });
            setModal("help");
        }, [pco2Unit]);

        const startExam = () => { setMode("koe"); setExamLog([]); goTo(0, newDeck()); };
        const backToPractice = () => { setMode("harjoitus"); setExamLog([]); goTo(session.pos + 1); };

        const examFinished = mode === "koe" && examLog.length >= EXAM_LENGTH;
        const showCompensationGrid = needsCompensation;
        const showFeedback = submitted && mode !== "koe";

        return (
            <Fragment>
                {createPortal(
                    <Fragment>
                        <ScoreDisplay score={score} attempts={attempts} streak={streak} animate={animateScore}
                            position={session.pos} total={session.deck.length} examCount={examLog.length} mode={mode} />
                        <UnitSelector selectedUnit={pco2Unit} onUnitChange={setPco2Unit} />
                    </Fragment>,
                    document.getElementById("score-root")
                )}

                <div className="container">
                    <h1>{texts.title}</h1>
                    <button type="button" onClick={() => openHelp("general")} className="help-button-general" aria-label="Avaa yleisohje">?</button>

                    <div className="toolbar">
                        <label className="switch">
                            <input type="checkbox" checked={blind} onChange={e => setBlind(e.target.checked)} />
                            <span>{ui.blind}</span>
                        </label>
                        <button type="button" className="toolbar-button" onClick={() => setModal("stats")}>{ui.statsButton}</button>
                        <button type="button" className="toolbar-button" onClick={() => setSidebarOpen(true)}>{texts.showCasesButton}</button>
                        {mode === "harjoitus"
                            ? <button type="button" className="toolbar-button" onClick={startExam}>{ui.examStart}</button>
                            : <button type="button" className="toolbar-button" onClick={() => { setMode("harjoitus"); setExamLog([]); }}>{ui.examBack}</button>}
                    </div>

                    {examFinished ? (
                        <ExamReport log={examLog} onRestart={startExam} onBack={() => { setMode("harjoitus"); setExamLog([]); goTo(session.pos + 1); }} />
                    ) : (
                        <Fragment>
                            {(!blind || contextShown) ? (
                                <div className="case-context">
                                    <p><strong>{texts.caseLabel}</strong> {scenario.context}</p>
                                </div>
                            ) : (
                                <div className="case-context blind-notice">
                                    <p>{ui.blindNotice}</p>
                                    <button type="button" className="secondary-button small" onClick={() => setContextShown(true)}>{ui.showContext}</button>
                                </div>
                            )}

                            <ABGDisplay scenario={scenario} pco2Unit={pco2Unit} onOpenHelp={openHelp} />
                            <p className="help-hint">{ui.helpHint}</p>
                            <hr />

                            <OptionsGrid title={texts.selectPrimary} options={PRIMARY_OPTIONS} selectedValue={primary}
                                onSelect={setPrimary} disabled={submitted} type="primary" />

                            {showCompensationGrid ? (
                                <Fragment>
                                    <hr />
                                    <OptionsGrid className="fade-in-effect" title={texts.selectCompensation}
                                        options={COMPENSATION_OPTIONS} selectedValue={comp} onSelect={setComp}
                                        disabled={submitted} type="compensation" />
                                </Fragment>
                            ) : null}

                            {showFeedback ? (
                                <FeedbackDisplay isCorrect={correct} revealed={revealed} scenario={scenario}
                                    selectedPrimary={primary} selectedCompensation={comp} />
                            ) : null}

                            {submitted && mode === "koe" ? <p className="exam-answered">{ui.examAnswered}</p> : null}

                            <div className="action-bar">
                                {!submitted ? (
                                    <Fragment>
                                        <button type="button" className="new-question" onClick={submit} disabled={!canSubmit}>{ui.answer}</button>
                                        <button type="button" className="secondary-button" onClick={() => goTo(session.pos + 1)}>{ui.skip}</button>
                                        {mode === "harjoitus"
                                            ? <button type="button" className="secondary-button" onClick={reveal}>{ui.reveal}</button>
                                            : null}
                                    </Fragment>
                                ) : (
                                    <Fragment>
                                        <button type="button" className="new-question" onClick={() => goTo(session.pos + 1)}>
                                            {mode === "koe" ? ui.next : texts.newQuestion}
                                        </button>
                                        {mode === "harjoitus" && !correct
                                            ? <button type="button" className="secondary-button" onClick={retry}>{ui.retry}</button>
                                            : null}
                                    </Fragment>
                                )}
                            </div>
                        </Fragment>
                    )}
                </div>

                <HelpModal isOpen={modal === "help"} onClose={() => setModal(null)} title={modalContent.title}>
                    {modalContent.content}
                </HelpModal>
                <HelpModal isOpen={modal === "stats"} onClose={() => setModal(null)} title={ui.statsTitle}>
                    <StatsPanel stats={stats} onReset={() => { if (window.confirm(ui.statsConfirm)) setStats({}); }} />
                    <p className="stats-note">{ui.firstAttemptNote}</p>
                </HelpModal>
                <CaseListSidebar cases={patientCases} isOpen={sidebarOpen}
                    onClose={() => setSidebarOpen(false)} onSelectCase={loadSpecificCase} />
            </Fragment>
        );
    }

    function App() { return <ABGQuiz />; }
    ReactDOM.render(<App />, document.getElementById('root'));

    </script> 
</body>
</html>
